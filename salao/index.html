<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17418F">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lista da Vez">
<title>Painel das Lojas · Brasileiríssima</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout de painel administrativo: barra superior azul fixa, menu lateral branco com submenus, conteúdo em cartões, gaveta de filtros à direita */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --sunk:#F0F2F6; --ink:#1E2433; --muted:#667085; --line:#E2E6EE;
  --top:#17418F; --top-ink:#FFFFFF; --top-soft:rgba(255,255,255,.14);
  --accent:#1A56DB; --accent-hover:#1444B0; --accent-ink:#FFFFFF; --accent-soft:#E8EFFD;
  --brand:#F2306D; --nav-act:#E8EFFD;
  --good:#12875A; --good-soft:#E2F4EC; --warn:#B7791F; --warn-soft:#FFF4DE; --bad:#D92D3A; --bad-soft:#FDECEE;
  --cmp:#98A2B3; --c1:#1A56DB; --c2:#F2306D; --c3:#12875A; --c4:#E8A317; --c5:#7A5AF8; --c6:#0E9384; --c7:#98A2B3;
  --scrim:rgba(16,24,40,.45); --toast:#1E2433;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:8px; --rb:6px; color-scheme:light;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--top)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* barra superior */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--top);color:var(--top-ink);height:56px;display:flex;align-items:center;gap:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tb-btn{background:none;border:0;color:var(--top-ink);width:38px;height:38px;border-radius:8px;display:grid;place-items:center;cursor:pointer;flex:none}
.tb-btn:hover{background:var(--top-soft)}
.tb-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.mark{width:30px;height:30px;border-radius:8px;background:var(--brand);display:grid;place-items:center;font-weight:700;color:#FFFFFF;flex:none}
.ctx{font-weight:700;letter-spacing:.02em;text-transform:uppercase;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.ctx small{font-weight:500;text-transform:none;letter-spacing:0;opacity:.8;margin-left:8px}
.btn-filtros{display:flex;align-items:center;gap:6px;background:#FFFFFF;color:var(--ink);border:0;border-radius:6px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer;flex:none}
.btn-filtros svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.btn-filtros .n{background:var(--brand);color:#FFFFFF;border-radius:99px;font-size:11px;padding:0 6px}
.user{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;flex:none;max-width:200px}
.user .av{background:#FFFFFF;color:var(--top)}
.user span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){.user span{display:none}}

/* estrutura */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 56px)}
.shell.mini{grid-template-columns:64px minmax(0,1fr)}
.side{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:calc(56px + env(safe-area-inset-top,0px));height:calc(100vh - 56px - env(safe-area-inset-top,0px));overflow:auto;padding:14px 10px 24px;padding-left:max(10px,env(safe-area-inset-left,0px))}
.nav{display:grid;gap:1px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:6px;color:var(--muted);text-decoration:none;font-weight:500;font-size:13.5px;cursor:pointer;white-space:nowrap}
.nav a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a.on{color:var(--accent);font-weight:600}
.nav a.on.leaf{background:var(--nav-act);box-shadow:inset 3px 0 0 var(--brand)}
.nav .sub{display:grid;gap:1px;margin:2px 0 6px 29px}
.nav .sub a{padding:6px 10px;font-size:13px}
.nav .sep{height:1px;background:var(--line);margin:8px 6px}
.nav .badge{margin-left:auto;background:var(--brand);color:#FFFFFF;font-size:11px;font-weight:700;border-radius:99px;padding:0 7px}
.shell.mini .nav a span,.shell.mini .nav .sub,.shell.mini .nav .badge{display:none}
.shell.mini .nav a{justify-content:center}
@media (max-width:900px){
  .shell,.shell.mini{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:calc(56px + env(safe-area-inset-top,0px));bottom:0;height:auto;width:270px;max-width:85vw;z-index:25;transform:translateX(-102%);transition:transform .2s;box-shadow:0 10px 30px rgba(16,24,40,.2)}
  .shell.open .side{transform:none}
  .shell.mini .nav a span,.shell.mini .nav .sub,.shell.mini .nav .badge{display:revert}
  .shell.mini .nav a{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
main{min-width:0;padding-block:22px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:901px){main{padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}}
.page{max-width:1320px;display:grid;gap:18px}
.banner{background:var(--accent-soft);border:1px solid #C9D8F8;border-radius:var(--r);padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13.5px}

/* tipografia e utilitários */
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
h3{font-size:14.5px;font-weight:600;margin:0;display:flex;align-items:center;gap:8px}
h3 svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
.muted{color:var(--muted)}
.sm{font-size:12.5px}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph .sub{color:var(--muted);font-size:13px;margin-top:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.red{color:var(--bad)} .green{color:var(--good)} .yellow{color:var(--warn)}

/* botões e campos */
.btn{border-radius:var(--rb);padding:8px 14px;min-height:36px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover:not(:disabled){border-color:#B7C2D6;background:var(--sunk)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.dark{background:#2B3445;color:#FFFFFF;border-color:#2B3445}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:12.5px}
#btnTotvs{flex:none}#btnTotvs.busy svg{animation:gira 1s linear infinite}@keyframes gira{to{transform:rotate(360deg)}}@media(max-width:560px){#totvsLbl{display:none}}
.btn.link{border:0;background:none;color:var(--accent);padding:2px;min-height:0}
.btn.link:hover{background:none;text-decoration:underline}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--rb);padding:7px 10px;min-height:36px;min-width:0;max-width:100%}
textarea{min-height:84px;resize:vertical;width:100%}
input:hover,select:hover,textarea:hover{border-color:#B7C2D6}
input:disabled,select:disabled,textarea:disabled{background:var(--sunk);color:var(--muted)}
input[type=checkbox],input[type=radio]{min-height:0;width:16px;height:16px;margin:0;accent-color:var(--accent);flex:none}
label.f{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
label.f.req>span::after{content:" *";color:var(--bad)}
.ck{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;line-height:1.3}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.err{color:var(--bad);font-size:12.5px;font-weight:500}

/* cartões e tabelas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:12px;min-width:0;align-content:start}
.card>.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.big{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card .tbl{border:0;border-radius:0;margin-inline:-18px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
thead th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface)}
tbody tr:hover>td{background:#F7F9FC}
tr:last-child>td{border-bottom:0}
td.n,th.n{text-align:right}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--ink)}
tr.tot>td{font-weight:700;background:var(--sunk)}
tr.grp>td{background:#2B3445;color:#FFFFFF;font-weight:600;font-size:12.5px}
tr.dark>td{background:#2B3445;color:#FFFFFF}
tr.dark:hover>td{background:#2B3445}
tr.child>td:first-child{padding-left:42px}
.exp{background:none;border:0;cursor:pointer;width:22px;height:22px;display:inline-grid;place-items:center;color:var(--muted);margin-right:4px;vertical-align:middle}
.exp svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;transition:transform .15s}
.exp.on svg{transform:rotate(90deg)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.blue{background:var(--accent-soft);color:var(--accent)}
.av{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:12.5px;flex:none;color:#FFFFFF;background:var(--c1);position:relative}
.av.lg{width:52px;height:52px;font-size:17px}
.av .st{position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;border:2px solid #FFFFFF}
.empty{border:1px dashed #C9D1DE;border-radius:var(--r);padding:28px 16px;color:var(--muted);text-align:center;display:grid;gap:10px;justify-items:center;background:var(--surface)}
.empty svg{width:56px;height:56px;stroke:#A9B3C4;fill:none;stroke-width:1.4}
.var{font-weight:600;white-space:nowrap}
.var.up{color:var(--good)} .var.down{color:var(--bad)}
.prog{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;min-width:80px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.dd{position:relative;display:inline-block}
.dd-m{position:absolute;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(16,24,40,.14);z-index:15;min-width:190px;padding:4px;display:grid}
.dd-m button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:4px;cursor:pointer;font-size:13px;white-space:nowrap}
.dd-m button:hover{background:var(--sunk)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;padding:9px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:5px 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:#2B3445;color:#FFFFFF}

/* grades da visão geral */
.ov{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.ov-main{display:grid;gap:18px;min-width:0}
.ov-side{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}
@media (max-width:1100px){.ov{grid-template-columns:1fr}.ov-side{position:static;max-height:none}}
.g3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.g2w{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
@media (max-width:800px){.g3,.g2,.g2w{grid-template-columns:1fr}}
.stack{display:grid;gap:18px;align-content:start}
.alert-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.alert-row:last-child{border-bottom:0}
.alert-list{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 10px}
.perf{display:grid;grid-template-columns:1fr 1fr;gap:0}
.perf>div{display:grid;gap:8px;justify-items:center;padding:6px 10px}
.perf>div+div{border-left:1px solid var(--line)}
.perf dl{display:grid;gap:2px;margin:0;width:100%}
.perf dt{font-size:12px;color:var(--muted)} .perf dd{margin:0 0 6px;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.donut{width:150px;max-width:100%;height:auto}
.donut .bg{stroke:var(--sunk)}
.donut text{font-family:var(--f-body);font-weight:600;font-size:20px}
.side-list{display:grid}
.side-item{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.side-item:hover{background:var(--sunk)}
.side-item b{display:block;font-weight:600;font-size:13.5px}
.side-item small{font-size:12.5px;color:var(--muted)}
.kv{display:grid;gap:6px}
.kv div{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.kv.l div{justify-content:flex-start;gap:8px}
.tbl.cp th,.tbl.cp td{padding:8px 10px}
.mini-tabs{display:flex;gap:6px;flex-wrap:wrap}

/* gráficos */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .g{stroke:var(--line);fill:none}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.legend i.ln{height:3px;border-radius:2px;vertical-align:3px}
.hbars{display:grid;gap:8px}
.hbars .r{display:grid;grid-template-columns:minmax(110px,240px) 1fr 70px;gap:10px;align-items:center;font-size:13px}
.hbars .r>span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.hbars .prog{height:10px}

/* gaveta de filtros e modais */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:340px;max-width:92vw;background:var(--surface);z-index:51;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(16,24,40,.2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer>.hd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer>.hd h2{flex:1;text-align:center;font-size:15px}
.drawer>.bd{overflow:auto;padding:14px 16px;display:grid;gap:16px;align-content:start;flex:1}
.drawer>.ft{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:center}
.fsec{display:grid;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.fsec:last-child{border-bottom:0}
.fsec .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fsec .two input{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#2B3445;color:#FFFFFF;border-radius:6px;padding:4px 8px;font-size:12.5px;font-weight:600;border:0;cursor:pointer}
.chip.lt{background:var(--sunk);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:#FFFFFF}
.flist{display:grid;gap:2px;max-height:240px;overflow:auto}
.flist button{display:flex;gap:8px;align-items:center;background:none;border:0;padding:6px 4px;border-radius:4px;cursor:pointer;text-align:left;font-size:13px}
.flist button:hover{background:var(--sunk)}
.grp-h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);background:none;border:0;cursor:pointer;padding:2px 0;text-transform:uppercase;letter-spacing:.04em}
.modal-bg{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:60;padding:16px}
.modal{background:var(--surface);border-radius:10px;width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto;display:grid;gap:16px;padding:20px 22px;box-shadow:0 20px 50px rgba(16,24,40,.3)}
.modal.wide{max-width:860px}
.modal>.hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.modal .ft{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.x{background:none;border:0;cursor:pointer;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.x:hover{background:var(--sunk)}
.x svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--toast);color:#FFFFFF;padding:11px 18px;border-radius:8px;z-index:80;font-size:13.5px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(16,24,40,.25)}

/* assistente de metas */
.wiz{display:grid;gap:22px}
.wiz-bar{height:4px;background:var(--line);border-radius:99px;overflow:hidden}
.wiz-bar i{display:block;height:100%;background:var(--good);border-radius:99px}
.wiz h2{font-size:18px}
.opt{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:14px 16px;cursor:pointer;background:var(--surface);text-align:left;max-width:520px;width:100%}
.opt:hover{border-color:#B7C2D6}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.opt svg{width:28px;height:28px;stroke:var(--muted);fill:none;stroke-width:1.6;flex:none}
.opt b{display:block;margin-bottom:2px}
.opt small{color:var(--muted);font-size:12.5px;line-height:1.45;display:block}
.nbtn{display:flex;gap:8px;flex-wrap:wrap}
.nbtn button{width:42px;height:42px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;font-size:16px;color:var(--muted)}
.nbtn button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px var(--accent)}

async function gravarLote(items,prog){
  let ok=0;
  for(const[c,id,d]of items){
    if(d)S[KEY[c]][id]=d;else delete S[KEY[c]][id];
    if(!demo&&db){try{d?await db.collection(c).doc(id).set(d):await db.collection(c).doc(id).delete()}catch(e){toast(errMsg(e));break}}
    ok++;if(prog&&ok%10===0){const el=document.getElementById(prog);if(el)el.textContent=`Gravando ${ok} de ${items.length}…`}
  }
  bump();scheduleRender();return ok;
}

/* ================= índices e agregados ================= */
function idx(){return memo('idx',()=>{
  const A=new Map(),V=new Map(),J=new Map(),lastA={},lastV={};
  const push=(m,k,x)=>{let a=m.get(k);if(!a)m.set(k,a=[]);a.push(x)};
  for(const a of Object.values(S.atend)){if(!a||!a.data)continue;push(A,a.lojaId+'|'+a.data,a);if(!lastA[a.lojaId]||a.data>lastA[a.lojaId])lastA[a.lojaId]=a.data}
  const noResumo=new Set();
  for(const r of Object.values(S.vdia||{})){if(!r||!r.data||!r.lojaId)continue;(r.ids||[]).forEach(i=>noResumo.add(i));Object.values(r.fil||{}).forEach(f=>(f.ids||[]).forEach(i=>noResumo.add(i)));
    for(const[vid,x]of Object.entries(r.vend||{}))push(V,r.lojaId+'|'+r.data,{vendedorId:vid,lojaId:r.lojaId,data:r.data,valor:+x.valor||0,pecas:+x.pecas||0,n:+x.qtd||0,resumo:1});
    if(!lastV[r.lojaId]||(r.atualizadoEm||r.data)>lastV[r.lojaId])lastV[r.lojaId]=r.atualizadoEm||r.data}
  for(const[id,v]of Object.entries(S.vendas)){if(!v||!v.data||noResumo.has(id))continue;push(V,v.lojaId+'|'+v.data,v);if(!lastV[v.lojaId]||(v.importadoEm||v.data)>lastV[v.lojaId])lastV[v.lojaId]=v.importadoEm||v.data}
  for(const j of Object.values(S.jor)){if(!j||!j.data)continue;push(J,j.lojaId+'|'+j.data,j)}
  return{A,V,J,lastA,lastV};
})}
const mk=()=>({atend:0,opp:0,conv:0,trocas:0,perdas:0,pref:0,fv:0,ts:0,tn:0,valor:0,qtd:0,pecas:0,uP:0,uMin:0,mais:0,menos:0,L:0,hasT:0});
const ADD=['atend','opp','conv','trocas','perdas','pref','fv','ts','tn','valor','qtd','pecas','uP','uMin','mais','menos','L','hasT'];
function dayAgg(lid,d){return memo('da|'+lid+'|'+d,()=>{
  const ix=idx(),k=lid+'|'+d,A=ix.A.get(k)||[],T=ix.V.get(k)||[],hasT=T.length>0,by={},tot=mk();
  const g=vid=>by[vid]||(by[vid]=mk());
  for(const a of A){const s=g(a.vendedorId);for(const t of[s,tot]){t.atend++;if(a.resultado==='troca')t.trocas++;else t.opp++;if(a.resultado==='venda'){t.conv++;t.L++}if(a.resultado==='perda')t.perdas++;if(a.pref)t.pref++;if(a.foraDaVez)t.fv++;if(a.fim&&a.inicio){t.ts+=a.fim-a.inicio;t.tn++}}}
  const sales=hasT?T:A.filter(a=>a.resultado==='venda');
  for(const v of sales){const s=g(v.vendedorId),n=v.resumo?(+v.n||0):1;for(const t of[s,tot]){t.valor+=+v.valor||0;t.qtd+=n;t.pecas+=+v.pecas||0}}
  if(hasT){const P={};T.forEach(v=>{P[v.vendedorId]=(P[v.vendedorId]||0)+(v.resumo?(+v.n||0):1)});
    for(const vid of new Set(Object.keys(P).concat(Object.keys(by)))){const s=g(vid),p=P[vid]||0,l=s.L;s.uP=p;s.uMin=Math.min(l,p);s.mais=Math.max(0,l-p);s.menos=Math.max(0,p-l);s.hasT=1;tot.uP+=p;tot.uMin+=s.uMin;tot.mais+=s.mais;tot.menos+=s.menos}
    tot.hasT=1}
  return{tot,by};
})}
function fechar(t){t.cv=t.opp?t.conv/t.opp:NaN;t.pa=t.qtd?t.pecas/t.qtd:NaN;t.ticket=t.qtd?t.valor/t.qtd:NaN;t.preco=t.pecas?t.valor/t.pecas:NaN;t.usab=t.uP?t.uMin/t.uP:NaN;t.tempo=t.tn?t.ts/t.tn:NaN;return t}
/* indicadores somados em um intervalo de datas, para lojas e (opcional) vendedores */
function stats(ini,fim,lojas,vids){
  const key='st|'+ini+'|'+fim+'|'+lojas.join(',')+'|'+(vids?[...vids].join(','):'');
  return memo(key,()=>{const t=mk();
    for(const d of diasEntre(ini,fim))for(const lid of lojas){const a=dayAgg(lid,d);
      if(!vids){for(const k of ADD)t[k]+=a.tot[k]}else for(const vid of vids){const s=a.by[vid];if(s)for(const k of ADD)t[k]+=s[k]}}
    return fechar(t)});
}
function rawA(ini,fim,lojas){const ix=idx(),o=[];for(const d of diasEntre(ini,fim))for(const lid of lojas){const a=ix.A.get(lid+'|'+d);if(a)o.push(...a)}return o}
function rawJ(ini,fim,lojas){const ix=idx(),o=[];for(const d of diasEntre(ini,fim))for(const lid of lojas){const a=ix.J.get(lid+'|'+d);if(a)o.push(...a)}return o}
function vendasDia(lid,d,vid){const a=dayAgg(lid,d);return vid?(a.by[vid]?.valor||0):a.tot.valor}

/* documento de meta normalizado: aceita o formato antigo (total + vendedores) e o novo (ciclo, períodos, níveis, distribuição, formato) */
function metaNorm(lid,m){return memo('mn|'+lid+'|'+m,()=>{const raw=S.metas[lid+'_'+m];return raw?normRaw(raw,lid,m,lid+'_'+m):null})}
function normRaw(raw,lid,m,key){
  const ini=raw.ini||m+'-01',fim=raw.fim||fimMes(m);
  let periodos=(raw.periodos&&raw.periodos.length)?raw.periodos.map(p=>({ini:p.ini,fim:p.fim,valor:+p.valor||0})):[{ini,fim,valor:0}];
  const ciclo=raw.ciclo||'mes';
  const total=ciclo==='periodo'?periodos.reduce((s,p)=>s+p.valor,0):(+raw.total||0);
  if(!(total>0))return null;
  const niveis=(raw.niveis&&raw.niveis.length)?raw.niveis.map(Number):[100];
  let dist=raw.dist||{modo:'linear'};
  if(!raw.v&&dist.modo){const W=(dist.pesos&&dist.pesos.length===7)?dist.pesos.map(Number):[115,90,90,95,105,120,110];
    dist=dist.modo==='semana'?{modo:'pesos',pesos:Object.fromEntries(diasEntre(ini,fim).map(d=>[d,W[dow(d)]]))}:{modo:'linear'}}
  return{key,lojaId:lid,mes:m,ini,fim,ciclo,periodos,total,niveis,dist,formato:raw.formato||'personalizados',vend:raw.vend||raw.vendedores||{},disp:raw.disp||{},
    arquivado:!!raw.arquivado,arquivadoEm:raw.arquivadoEm||'',congelado:raw.congelado||null};
}
const lojaTemMetaDia=(mn,d)=>(mn.disp[d]?.all)!=='fsem';
function vendTemMeta(vid,d,mn){const v=S.vend[vid];if(!v)return false;if(v.inicio&&d<v.inicio)return false;if(v.fim&&d>v.fim)return false;
  if((v.ausencias||[]).some(a=>d>=a.ini&&d<=a.fim))return false;const x=mn.disp[d]||{};if(x[vid]==='fsem')return false;if(x[vid])return true;return x.all!=='fsem'}
function pesoDia(mn,d,n){if(!lojaTemMetaDia(mn,d))return 0;if(mn.dist.modo!=='pesos')return 1;const p=mn.dist.pesos||{};return p[d]!=null?Math.max(0,+p[d]):100/n}
function participantes(mn){const s=new Set(Object.keys(mn.vend).filter(id=>S.vend[id]));vendLoja(mn.lojaId,mn.ini,true).forEach(([id,v])=>{if(!(v.fim&&v.fim<mn.ini))s.add(id)});return[...s].filter(id=>!(S.vend[id].inicio&&S.vend[id].inicio>mn.fim))}
/* metas diárias (1ª meta) da loja e de cada vendedor */
function metaDias(mn){return memo('md|'+mn.key,()=>calcDias(mn))}
function calcDias(mn){
  if(mn.congelado&&mn.congelado.loja){const c=mn.congelado,vendTot={};Object.entries(c.vend||{}).forEach(([id,o])=>vendTot[id]=Object.values(o).reduce((a,b)=>a+b,0));
    return{dias:diasEntre(mn.ini,mn.fim),w:{},loja:c.loja,vend:c.vend||{},vendTot,nV:c.nV||{},ps:Object.keys(c.vend||{})}}
  const dias=diasEntre(mn.ini,mn.fim),n=dias.length,w={};dias.forEach(d=>w[d]=pesoDia(mn,d,n));
  const loja={};
  if(mn.ciclo==='periodo'){for(const p of mn.periodos){const ds=dias.filter(d=>d>=p.ini&&d<=p.fim),sw=ds.reduce((s,d)=>s+w[d],0);ds.forEach(d=>loja[d]=sw?p.valor*w[d]/sw:0)}}
  else{const sw=dias.reduce((s,d)=>s+w[d],0);dias.forEach(d=>loja[d]=sw?mn.total*w[d]/sw:0)}
  const ps=participantes(mn),vend={},vendTot={},nV={};ps.forEach(id=>{vend[id]={};vendTot[id]=0});
  if(mn.formato==='independentes'){for(const id of ps){const ds=dias.filter(d=>vendTemMeta(id,d,mn)),sw=ds.reduce((s,d)=>s+(w[d]||0),0),tot=+mn.vend[id]||0;ds.forEach(d=>{const v=sw?tot*w[d]/sw:0;vend[id][d]=v;vendTot[id]+=v})}
    dias.forEach(d=>nV[d]=ps.filter(id=>vendTemMeta(id,d,mn)).length)}
  else{for(const d of dias){const on=ps.filter(id=>vendTemMeta(id,d,mn));nV[d]=on.length;if(!on.length)continue;
    const wt=on.map(id=>mn.formato==='proporcionais'?1:Math.max(0,+mn.vend[id]||0)),sw=wt.reduce((a,b)=>a+b,0);
    on.forEach((id,i)=>{const v=sw?loja[d]*wt[i]/sw:loja[d]/on.length;vend[id][d]=v;vendTot[id]+=v})}}
  return{dias,w,loja,vend,vendTot,nV,ps};
}
const mesesEntre=(a,b)=>{const o=[];for(let m=a.slice(0,7);m<=b.slice(0,7);m=proxMes(m))o.push(m);return o};
/* soma das metas diárias de um intervalo; nivel 0 = 1ª meta */
function metaRange(lojas,ini,fim,vid,nivel=0){let s=0;for(const lid of lojas)for(const m of mesesEntre(ini,fim)){const mn=metaNorm(lid,m);if(!mn)continue;const md=metaDias(mn),f=(mn.niveis[nivel]??NaN)/100;if(!fin(f))continue;
  const src=vid?(md.vend[vid]||{}):md.loja;for(const[d,v]of Object.entries(src))if(d>=ini&&d<=fim)s+=v*f}return s}
function temNivel(lojas,m,nivel){return lojas.some(l=>{const mn=metaNorm(l,m);return mn&&mn.niveis[nivel]!=null})}
/* meta do dia recalculada: saldo do ciclo distribuído pelos dias restantes, na proporção das metas diárias */
function metaAtual(lid,d,vid){const m=d.slice(0,7),mn=metaNorm(lid,m);if(!mn||d<mn.ini||d>mn.fim)return NaN;const md=metaDias(mn),src=vid?(md.vend[vid]||{}):md.loja;
  const tot=Object.values(src).reduce((a,b)=>a+b,0),antes=d>mn.ini?(vid?stats(mn.ini,addDias(d,-1),[lid],[vid]).valor:stats(mn.ini,addDias(d,-1),[lid]).valor):0;
  const rest=Object.entries(src).filter(([k])=>k>=d).reduce((a,[,v])=>a+v,0);if(!(rest>0))return 0;return Math.max(0,tot-antes)*(src[d]||0)/rest}
function metaAtualRange(lojas,d,vid){return lojas.reduce((s,l)=>{const v=metaAtual(l,d,vid);return s+(fin(v)?v:0)},0)}

function donut(p,cor){const r=54,c=2*Math.PI*r,v=Math.max(0,Math.min(1,fin(p)?p:0));

const PAL=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)','#C4320A','#475467','#6172F3','#DD2590','#66C61C','#F79009','#2E90FA','#9E77ED'];

/* gráfico de séries: tipos bar | line | area | dash; fmt formata o eixo */
function chart({labels,series,fmt=brl0,h=240,yMax,lbl}){
  const W=760,H=h,pl=70,pr=12,pt=14,pb=34,iw=W-pl-pr,ih=H-pt-pb,n=labels.length;if(!n)return'';
  let mx=yMax||niceMax(Math.max(0,...series.flatMap(s=>s.vals.filter(fin))));const bw=iw/n,y=v=>pt+ih-(Math.max(0,v)/mx)*ih,cx=i=>pl+i*bw+bw/2;
  const step=n>16?Math.ceil(n/14):1,bars=series.filter(s=>s.type==='bar'),bwi=bw*.7/Math.max(1,bars.length);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  for(let k=0;k<=4;k++){const v=mx*k/4;s+=`<line class="g" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`}
  labels.forEach((l,i)=>{if(i%step===0)s+=`<text x="${cx(i)}" y="${H-10}" text-anchor="middle">${esc(lbl?lbl(l,i):l)}</text>`});
  bars.forEach((se,bi)=>se.vals.forEach((v,i)=>{if(!(v>0))return;const x=cx(i)-bw*.35+bi*bwi;s+=`<rect x="${x}" y="${y(v)}" width="${Math.max(1,bwi-1)}" height="${pt+ih-y(v)}" rx="2" fill="${se.color}"><title>${esc(labels[i])} · ${esc(se.name)}: ${fmt(v)}</title></rect>`}));
  series.filter(se=>se.type!=='bar').forEach(se=>{const pts=se.vals.map((v,i)=>fin(v)?[cx(i),y(v)]:null).filter(Boolean);if(!pts.length)return;
    if(se.type==='area')s+=`<path d="M${pts[0][0]} ${pt+ih} ${pts.map(p=>'L'+p[0]+' '+p[1]).join(' ')} L${pts.at(-1)[0]} ${pt+ih}Z" fill="${se.color}" opacity=".18"/>`;
    s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${se.color}" stroke-width="2.2" stroke-linejoin="round"${se.type==='dash'?' stroke-dasharray="6 5"':''}/>`;
    if(n<=40&&se.type!=='dash')se.vals.forEach((v,i)=>{if(fin(v))s+=`<circle cx="${cx(i)}" cy="${y(v)}" r="2.8" fill="${se.color}"><title>${esc(labels[i])} · ${esc(se.name)}: ${fmt(v)}</title></circle>`})});
  return s+'</svg>'}

function variacaoAnual(lojas){const y=+hoje().slice(0,4),cm=+hoje().slice(5,7);let acA=0,acP=0;const rows=[];

const IND=[['pm','Percentual da 1ª meta'],['pa','Peças por atendimento'],['pecas','Quantidade de peças'],['cv','Taxa de conversão'],['ticket','Ticket médio'],['valor','Volume de vendas']];

function rkCalc(r){const h=hoje(),fimRef=r.referencia==='anterior'?addDias(h,-1):h,fim=r.fim<fimRef?r.fim:fimRef;if(fim<r.ini)return{lista:[],fora:[],fim};
  const ls=(r.lojas||[]).filter(l=>S.lojas[l]),ent=r.tipo==='lojas'?ls.map(l=>({id:l,nome:nomeLoja(l),lojas:[l],vid:null})):
    [...new Set(ls.flatMap(l=>{const s=new Set(vendLoja(l,r.ini,true).map(([i])=>i));diasEntre(r.ini,fim).forEach(d=>Object.keys(dayAgg(l,d).by).forEach(v=>s.add(v)));return[...s].map(v=>l+'|'+v)}))].map(x=>{const[l,v]=x.split('|');return{id:v,nome:nomeV(v),lojas:[l],vid:v,loja:l}}).filter(e=>S.vend[e.vid]&&S.vend[e.vid].lojaId===e.loja);
  const res=ent.map(e=>{const s=e.vid?stats(r.ini,fim,e.lojas,[e.vid]):stats(r.ini,fim,e.lojas),mt=metaRange(e.lojas,r.ini,fim,e.vid),pm=mt?s.valor/mt:NaN,val={pm,pa:s.pa,pecas:s.pecas,cv:s.cv,ticket:s.ticket,valor:s.valor}[r.indicador];
    let motivo='';if(+r.minMeta>0&&!(pm*100>=+r.minMeta))motivo='Abaixo de '+r.minMeta+'% da meta';else if(+r.minUsab>0&&fin(s.usab)&&s.usab*100<+r.minUsab)motivo='Usabilidade abaixo de '+r.minUsab+'%';
    else if(e.vid&&r.part!=='qualquer'){const dm=diasEntre(r.ini,fim).filter(d=>metaRange(e.lojas,d,d,e.vid)>0),dt=dm.filter(d=>(dayAgg(e.lojas[0],d).by[e.vid]?.atend||0)>0).length;
      if(r.part==='todos'&&dt<dm.length)motivo=`Participou de ${dt} de ${dm.length} dias da meta`;if(r.part==='n'&&dt<(+r.minDias||0))motivo=`Participou de ${dt} dias (mínimo ${r.minDias})`}
    return{...e,val,s,pm,motivo}}).filter(x=>x.s.atend||x.s.qtd);
  const ok=res.filter(x=>!x.motivo&&fin(x.val)).sort((a,b)=>b.val-a.val);return{lista:ok.slice(0,+r.qtd||10),resto:ok.slice(+r.qtd||10),fora:res.filter(x=>x.motivo||!fin(x.val)),fim}}

function wSum(w){const tot=wizTotal(w);
  if(w.step===8){const per=wizPeriodos(w),totP=diasEntre(w.ini,w.fim).reduce((a,d)=>a+(+w.pesos[d]||0),0),alvo=w.ciclo==='periodo'?per.length*100:100;
    return`<div class="row" style="justify-content:space-between"><span>Total cadastrado</span><b class="${Math.abs(alvo-totP)>.05?'red':''}">${w.ciclo==='periodo'?num(totP)+'% (100% por período)':brl(tot*totP/100)+' · '+num(totP)+'%'}</b></div><div class="row" style="justify-content:space-between"><span>Meta informada</span><b>${brl(tot)}</b></div>`}
  if(w.step===10){const sim=wizSim(w);if(!sim)return'';const ids=Object.keys(vendDias(w,sim.mn)),sv=ids.reduce((a,id)=>a+(w.formato==='proporcionais'?(sim.md.vendTot[id]||0):(+w.vend[id]||0)),0),bad=w.formato==='personalizados'&&Math.abs(sv-tot)>1;
    return`${w.formato!=='independentes'?'<span class="sm">O total das metas individuais deve ser igual à meta da loja:</span>':''}<div class="row" style="justify-content:space-between"><b>1ª meta da equipe</b><b class="${bad?'red':''}">${brl(sv)} ${w.formato==='personalizados'&&Math.abs(sv-tot)>.005?`<small>(${sv>tot?'+':''}${brl(sv-tot)})</small>`:''}</b></div><div class="row muted" style="justify-content:space-between"><span>1ª meta da loja</span><span>${brl(tot)}</span></div>`}
  return''}

async function usrCarregar(){if(usr.carregando)return;usr.carregando=true;try{usr.lista=(await PAINEL.fn('painel-usuarios',{acao:'listar'})).usuarios||[];usr.erro=''}catch(e){usr.erro=e.message}usr.carregando=false;scheduleRender()}
function vUsuarios(){if(!usr.lista&&!usr.carregando&&!usr.erro)usrCarregar();const d=dis(),lojas=lojasAtivas();
  let h=`<div class="ph"><div><h1>Logins do painel</h1><div class="sub">Crie um login para cada loja. Quem entra com o login da loja vê os resultados e usa a lista da vez daquela loja. O RH entra com o próprio usuário do Gestão de Pessoas.</div></div></div>`;
  h+=`<div class="card"><div class="hd"><h3>${svg('cad')}Novo login</h3></div><div class="g2" style="gap:12px">
    <label class="f">Login (sem espaços)<input id="nuLogin" placeholder="ex.: ssa.casa" autocapitalize="off" spellcheck="false" ${d}></label>
    <label class="f">Nome que aparece<input id="nuNome" placeholder="ex.: Loja BA SSA Casa" ${d}></label>
    <label class="f">Tipo<select id="nuPapel" ${d}><option value="loja">Loja</option><option value="admin">Administrador</option></select></label>
    <label class="f">Loja<select id="nuLoja" ${d}><option value="">— escolha —</option>${lojas.map(([id,l])=>`<option value="${esc(id)}">${esc(l.nome)}</option>`).join('')}</select></label>
    <label class="f">Senha inicial (mín. 8 caracteres)<input id="nuSenha" type="password" autocomplete="new-password" ${d}></label></div>
    <div class="row" style="justify-content:flex-end"><button class="btn pri" data-act="usrCriar" ${d}>Criar login</button></div></div>`;
  if(usr.erro)h+=`<div class="card"><p class="sm" style="margin:0;color:var(--bad)">${esc(usr.erro)}</p></div>`;
  const L=usr.lista||[];
  h+=`<div class="card"><div class="hd"><h3>${svg('cad')}Logins cadastrados</h3><span class="muted sm">${usr.carregando?'carregando…':L.length+' login(s)'}</span></div>
  ${L.length?`<div class="tw"><table><thead><tr><th>Login</th><th>Nome</th><th>Tipo</th><th>Loja</th><th>Situação</th><th></th></tr></thead><tbody>${L.map(u=>`<tr${u.ativo?'':' class="muted"'}><td>${esc(u.login)}</td><td>${esc(u.nome||'')}</td><td>${u.papel==='admin'?'Administrador':'Loja'}</td><td>${esc(u.loja_id?nomeLoja(u.loja_id):'—')}</td><td>${u.ativo?'Ativo':'Desativado'}</td>
    <td style="white-space:nowrap">${usr.senhaDe===u.user_id?`<input id="nsSenha" type="password" placeholder="nova senha" autocomplete="new-password" style="width:140px"> <button class="btn sm pri" data-act="usrSenhaOk" data-v="${u.user_id}">Salvar</button>`:`<button class="btn sm" data-act="usrSenha" data-v="${u.user_id}" ${d}>Nova senha</button>`} <button class="btn sm" data-act="usrAtivo" data-v="${u.user_id}" data-a="${u.ativo?0:1}" ${d}>${u.ativo?'Desativar':'Ativar'}</button></td></tr>`).join('')}</tbody></table></div>`:`<p class="muted sm" style="margin:0">${usr.carregando?'':'Nenhum login de loja criado ainda.'}</p>`}</div>`;
  return h}
ACT.usrCriar=async()=>{const v=id=>($('#'+id)?.value||'').trim(),b={acao:'criar',login:v('nuLogin').toLowerCase(),nome:v('nuNome'),papel:v('nuPapel'),loja_id:v('nuLoja'),senha:$('#nuSenha')?.value||''};
  if(b.papel==='loja'&&!b.loja_id){toast('Escolha a loja.');return}
  try{await PAINEL.fn('painel-usuarios',b);toast('Login '+b.login+' criado. Passe o login e a senha para a loja.');['nuLogin','nuNome','nuSenha'].forEach(id=>{const e=$('#'+id);if(e)e.value=''});usr.lista=null;usrCarregar()}catch(e){toast(e.message)}};
ACT.usrSenha=el=>{usr.senhaDe=el.dataset.v;render();setTimeout(()=>$('#nsSenha')?.focus(),30)};
ACT.usrSenhaOk=async el=>{const s=$('#nsSenha')?.value||'';try{await PAINEL.fn('painel-usuarios',{acao:'senha',user_id:el.dataset.v,senha:s});toast('Senha alterada.');usr.senhaDe=null;render()}catch(e){toast(e.message)}};
ACT.usrAtivo=async el=>{try{await PAINEL.fn('painel-usuarios',{acao:'ativo',user_id:el.dataset.v,ativo:el.dataset.a==='1'});usr.lista=null;usrCarregar()}catch(e){toast(e.message)}};
ACT.sair=()=>PAINEL.sair();
/* ================= início ================= */
render();
(async()=>{
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  dbState=db?'ok':'none';
  try{userCap=window.claude&&window.claude.use?await window.claude.use('user'):null}catch(e){userCap=null}
  if(userCap){try{const me=await userCap.me();ME.id=me.id;ME.name=me.name||'';isAdmin=!!me.canEdit;if(PAINEL.eu&&PAINEL.eu.papel==='loja'&&PAINEL.eu.loja){ui.f.lojas=[PAINEL.eu.loja];if(ui.route==='visao')ui.route='lista'}const c=await userCap.can('data.write');if(c===false)canWrite=false}catch(e){}}
  $('#userNm').textContent=ME.name||(isAdmin?'Editor':'Usuário');$('#userAv').textContent=iniciais(ME.name||'U');
  if(db)subscribe();
  if(!db&&!demo){entrarDemo();return}
  render();
  totvsIniciar();
})();
})();
</script>

</body>
</html>
