function pjParseBen(t){return String(t||"").split(/;\s*/).map(s=>s.trim()).filter(Boolean).map(s=>{const m=s.match(/^(.*?)[:=]\s*(.+)$/);return m?{tipo:m[1].trim(),valor:valNum(m[2]),obs:""}:{tipo:s,valor:"",obs:""}}).filter(b=>b.tipo)}
function pjParseFx(t){return String(t||"").split(/;\s*/).map(s=>s.trim()).filter(Boolean).map(s=>{const m=s.match(/^([\d.,]+)\s*(?:-|a|até)\s*([\d.,]*)\s*[:=]\s*([\d.,]+)/i);return m?{de:valNum(m[1]),ate:m[2]?valNum(m[2]):"",perc:valNum(m[3])}:null}).filter(Boolean)}
async function pjLerPlanilha(file){
  const st=(m,e)=>{const el=$("#pj-status");if(el){el.textContent=m;el.style.color=e?"var(--bad)":""}};
  if(!file)return;if(!window.XLSX){st("O leitor de planilhas não carregou. Recarregue a página.",true);return}
  try{
    st("Lendo a planilha…");let wb;
    if(/\.csv$/i.test(file.name)){const buf=await file.arrayBuffer();let txt;try{txt=new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(e){txt=new TextDecoder("windows-1252").decode(buf)}const l1=txt.split(/\r?\n/)[0]||"";wb=XLSX.read(txt.replace(/^﻿/,""),{type:"string",FS:(l1.match(/;/g)||[]).length>(l1.match(/,/g)||[]).length?";":",",raw:true})}
    else wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:"",raw:true,blankrows:false});
    const hi=aoa.findIndex(r=>Object.keys(pjMapear(r)).length>=3);
    if(hi<0){st("Não encontrei os cabeçalhos. Use o modelo: a primeira linha deve ter Razão social, CNPJ e Início da vigência.",true);return}
    const mapa=pjMapear(aoa[hi]);const faltam=["razaoSocial","cnpj","inicio"].filter(k=>!Object.values(mapa).includes(k));
    if(faltam.length){st("Faltam colunas obrigatórias: "+faltam.map(k=>PJ_COLS.find(c=>c.k===k).t).join(", ")+".",true);return}
    const linhas=[];const vistos=new Set();
    aoa.slice(hi+1).forEach((r,ri)=>{
      if(r.every(c=>String(c).trim()===""))return;
      const v={},erros=[];
      Object.entries(mapa).forEach(([i,k])=>{const c=PJ_COLS.find(x=>x.k===k);const x=r[i];if(String(x).trim()==="")return;
        if(k==="lojaId"){v.lojaId=achaLoja(x);if(!v.lojaId)erros.push("Unidade não encontrada: "+x)}
        else if(c.tp==="d"){v[k]=valData(x);if(!v[k])erros.push("Data inválida em "+c.t+": "+x)}
        else if(c.tp==="n"){v[k]=valNum(x);if(v[k]===null)erros.push("Número inválido em "+c.t+": "+x)}
        else if(c.tp==="b")v[k]=valBool(x);
        else if(String(c.tp).startsWith("sel:")){const ops=c.tp.slice(4).split("|");v[k]=ops.find(o=>semAcento(o)===semAcento(x))||ops.find(o=>semAcento(o).startsWith(semAcento(x)))||"";if(!v[k])erros.push(c.t+" não reconhecido: "+x)}
        else v[k]=String(x).trim().slice(0,500)});
      v.beneficios=pjParseBen(v.beneficiosTxt);v.faixas=pjParseFx(v.faixasTxt);delete v.beneficiosTxt;delete v.faixasTxt;
      v.modalidade=v.modalidade||"Mensal fixo";v.comTipo=v.comTipo||"Sem comissão";
      if(!v.razaoSocial)erros.push("Razão social em branco");
      if(!cnpjValido(v.cnpj))erros.push("CNPJ inválido: "+(v.cnpj||"em branco"));else{v.cnpj=fmtCNPJ(v.cnpj);if(vistos.has(soDig(v.cnpj)))erros.push("CNPJ repetido na planilha");vistos.add(soDig(v.cnpj))}
      if(!v.inicio&&!erros.some(e=>e.includes("Início")))erros.push("Início da vigência em branco");
      if(v.modalidade==="Por hora"?!(v.valorHora>0):!(v.valorMensal>0))erros.push("Valor do contrato em branco");
      const ex=v.cnpj&&(ST.pjs||[]).find(p=>!p.encerrado&&soDig(p.cnpj)===soDig(v.cnpj));
      linhas.push({n:ri+hi+2,v,erros,alvo:ex?ex.id:null});
    });
    if(!linhas.length){st("A planilha não tem contratos abaixo dos cabeçalhos.",true);return}
    PJIMP={origem:file.name,linhas};pjPrevia();
  }catch(e){console.error(e);st("Não foi possível ler este arquivo. Salve como .xlsx ou .csv e tente de novo.",true)}
}
function pjPrevia(){

/* ============ backup completo em arquivo (também serve para migrar para a versão internet) ============ */
function backupTexto(){const {usuarios,contasDesvinculadas,...o}=ST;return JSON.stringify({formato:"gestao-de-pessoas-backup",versao:1,geradoEm:new Date().toISOString(),por:SESSION?SESSION.nome:"",...o})}
async function baixarBackup(){
  const nome="backup-gestao-de-pessoas-"+TODAY+".json";
  try{const url=URL.createObjectURL(new Blob([backupTexto()],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
    logEvento("Backup completo baixado",ST.emps.length+" colaboradores · "+ST.stores.length+" unidades · "+(ST.pjs||[]).length+" PJ");toast("Backup baixado. Guarde em local seguro: ele contém dados pessoais.")}
  catch(e){toast("Não foi possível gerar o backup.")}
}
/* importa o arquivo baixado no portal do Claude (ou um backup desta versão) e grava tudo no Supabase */
async function importarBackupArquivo(file){
  if(!file)return;if(ROLE!=="rh"){toast("Só o RH pode importar backup.");return}
  let o;try{o=JSON.parse(await file.text())}catch(e){toast("Arquivo inválido. Use o backup .json baixado no portal.");return}
  if(!o||!Array.isArray(o.emps)||!Array.isArray(o.stores)){toast("Este arquivo não é um backup do Gestão de Pessoas.");return}
  if(ST&&ST.emps.length&&!confirm("Substituir TODOS os dados atuais pelos do backup ("+o.emps.length+" colaboradores, "+o.stores.length+" unidades)? Registros que não estiverem no backup serão apagados."))return;
  delete o.usuarios;delete o.contasDesvinculadas;delete o.formato;delete o.versao;delete o.geradoEm;delete o.por;
  if(o.escala&&!o.escalaOverrides){const m={};o.escala.forEach(x=>{m[x.k]=x.d});o.escalaOverrides=m;delete o.escala}
  const ids=new Set(o.stores.map(s=>s.id));
  const falta=id=>{if(id&&!ids.has(id)){ids.add(id);o.stores.push({id,nome:"Unidade "+id,cidade:"",tipo:"Loja de rua",quadro:0})}};
  o.emps.forEach(e=>falta(e.lojaId));(o.admissoes||[]).forEach(a=>falta(a.lojaId));Object.keys(o.escalaOverrides||{}).forEach(k=>falta(k.split("|")[0]));
  o.cfg=o.cfg||clone(DEFAULT_CFG);o.exemplo=false;
  ST=normalize(o);
  const gated=$(".app").classList.contains("gated");if(gated)mostrarApp();
  persist();go();
  logEvento("Backup importado",file.name+" · "+ST.emps.length+" colaboradores · "+ST.stores.length+" unidades · "+(ST.pjs||[]).length+" PJ");
  toast("Importando "+ST.emps.length+" colaboradores. Aguarde \"Tudo salvo\" no topo antes de fechar a página.");
}

  const b=$("#u-salvar");b.disabled=true;b.textContent="Salvando…";

function feriasCalc(){
  const e=emp($("#fe-emp").value);if(!e)return;const ini=$("#fe-ini").value;const dias=Number($("#fe-dias").value);const abono=dias===20?10:0;
  const sal=e.salario+(e.vendas?folha(e).comissao:0);
  const v=sal/30*dias,terco=v/3,ab=sal/30*abono,abT=ab/3;
  const avisos=[];const dw=parse(ini).getDay();
  if(dw===4||dw===5) avisos.push("Início em véspera de feriado ou de repouso semanal não é permitido; evite quinta e sexta (art. 134 §3º CLT).");
  if(diffDays(TODAY,ini)<30) avisos.push("O aviso de férias deve ser dado com 30 dias de antecedência.");
  if(e.comissao) avisos.push("Média de comissões incluída na remuneração das férias.");
  $("#fe-calc").innerHTML=`<div class="slip"><div class="slip-row h"><span>Verba</span><span>Ref.</span><span>Valor</span><span></span></div>
  <div class="slip-row"><span>Férias</span><span class="num">${dias}d</span><span class="num">${brl(v)}</span><span></span></div>
  <div class="slip-row"><span>1/3 constitucional</span><span></span><span class="num">${brl(terco)}</span><span></span></div>
  ${abono?`<div class="slip-row"><span>Abono pecuniário + 1/3</span><span class="num">10d</span><span class="num">${brl(ab+abT)}</span><span></span></div>`:""}
  <div class="slip-row t"><span>Total bruto</span><span></span><span class="num">${brl(v+terco+ab+abT)}</span><span></span></div></div>
  <div class="note">Retorno em ${fdate(addDays(ini,dias))}. Pagamento até ${fdate(addDays(ini,-2))} (2 dias antes do início).${avisos.length?"<br>"+avisos.map(esc).join("<br>"):""}</div>`;
}

      <div class="field"><label for="av-atrasos">Atrasos no período</label><input class="input num" id="av-atrasos" type="number" min="0" value="0"></div>
      <div class="field full"><label for="av-fortes">Pontos fortes</label><textarea class="input" id="av-fortes" rows="2"></textarea></div>
      <div class="field full"><label for="av-desenv">Pontos a desenvolver</label><textarea class="input" id="av-desenv" rows="2"></textarea></div>
    </div>
    <div class="field"><label>Decisão</label><div class="seg" role="radiogroup">${ops.map(([k,t])=>`<button type="button" data-parecer="${k}">${t}</button>`).join("")}</div></div>
    <div class="av-sum" id="av-sum"></div>
    <p class="small" id="av-err" style="color:var(--bad)" hidden></p>`,
    `<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" data-act="salvarAval" id="av-save">Salvar avaliação</button>`);
  avResumo();
}
function avResumo(){
  const e=emp(AV.eid);const tot=criterios(e.cargo).length;const n=Object.keys(AV.notas).length;const m=mediaNotas(AV.notas);
  const r=n?recomenda(m):null;
  $("#av-sum").innerHTML=`<div><span class="small muted">Nota média · ${n} de ${tot} critérios</span><br><b class="num">${n?m.toLocaleString("pt-BR",{minimumFractionDigits:1}):"—"}</b></div>${r?`<span class="chip ${r.c}">${r.t}</span>`:`<span class="small muted">Dê uma nota de 1 a 5 em cada critério</span>`}`;
  const b=$("#av-save");if(b){b.dataset.confirm="";b.className="btn "+(AV.parecer==="encerrar"?"btn-danger":"btn-primary");b.textContent=AV.parecer==="encerrar"?"Salvar e encerrar contrato":AV.parecer==="efetivar"?"Salvar e efetivar":"Salvar avaliação"}
}
function salvarAvaliacao(btn){
  const e=emp(AV.eid);const err=$("#av-err");const cs=criterios(e.cargo);
  const falta=cs.filter(c=>!AV.notas[c.k]);
  if(falta.length){err.hidden=false;err.textContent="Falta dar nota em: "+falta.map(c=>c.t).join(", ")+".";return}
  if(!AV.parecer){err.hidden=false;err.textContent="Escolha a decisão: "+(AV.marco===45?"prorrogar, efetivar ou encerrar.":"efetivar ou encerrar.");return}
  if(!$("#av-quem").value.trim()){err.hidden=false;err.textContent="Informe quem fez a avaliação.";return}
  if(AV.parecer==="encerrar"&&btn.dataset.confirm!=="1"){btn.dataset.confirm="1";btn.textContent="Toque de novo para encerrar o contrato";return}
  const a={id:uid(),marco:AV.marco,data:$("#av-data").value||TODAY,avaliador:$("#av-quem").value.trim(),notas:{...AV.notas},media:mediaNotas(AV.notas),
    faltas:Number($("#av-faltas").value)||0,atrasos:Number($("#av-atrasos").value)||0,fortes:$("#av-fortes").value.trim(),desenvolver:$("#av-desenv").value.trim(),parecer:AV.parecer};
  AV=null;closeModal();
  if(G()){enviarMov({tipo:"avaliacao",eid:e.id,av:a},"Avaliação enviada ao RH para aprovação");return}
  commit(aplicarAvaliacao(e,a));
}
function verAvaliacao(eid,aid){
  const e=emp(eid);const a=e&&(e.avaliacoes||[]).find(x=>x.id===aid);if(!a)return;
  mostrarAv(e,a,`<button class="btn" data-ficha="${e.id}">Abrir ficha</button><button class="btn btn-primary" data-close>Fechar</button>`);
}
function mostrarAv(e,a,foot){
  const r=recomenda(a.media);const pc=a.pendente?{t:"Aguardando RH",c:"c-warn"}:PARECER[a.parecer];
  modal("Avaliação de "+a.marco+" dias",`
    <div class="who"><div class="avatar" style="width:48px;height:48px">${initials(e.nome)}</div><div><b>${esc(e.nome)}</b><span>${esc(e.cargo)} · ${esc(store(e.lojaId).nome)}</span></div><span class="chip ${pc.c}" style="margin-left:auto">${pc.t}</span></div>
    <div class="note">Decisão: <b>${esc(PARECER[a.parecer].t)}</b></div>
    <div class="av-sum"><div><span class="small muted">Nota média</span><br><b class="num">${a.media.toLocaleString("pt-BR",{minimumFractionDigits:1})}</b></div><span class="chip ${r.c}">${r.t}</span></div>
    <div>${criterios(e.cargo).map(c=>{const n=a.notas[c.k]||0;return `<div class="crit"><p>${c.t}<small>${n?ESCALA[n]:"Sem nota"}</small></p><div class="rate" aria-label="Nota ${n}">${[1,2,3,4,5].map(i=>`<button type="button" tabindex="-1" class="${i===n?"on":""}" style="cursor:default" aria-hidden="true">${i}</button>`).join("")}</div></div>`}).join("")}</div>
    <div class="kv"><div><span>Avaliador(a)</span><b>${esc(a.avaliador)}</b></div><div><span>Data</span><b class="num">${fdate(a.data)}</b></div><div><span>Faltas</span><b class="num">${a.faltas}</b></div><div><span>Atrasos</span><b class="num">${a.atrasos}</b></div></div>
    ${a.fortes?`<div class="note"><b>Pontos fortes:</b> ${esc(a.fortes)}</div>`:""}
    ${a.desenvolver?`<div class="note"><b>Pontos a desenvolver:</b> ${esc(a.desenvolver)}</div>`:""}`,foot);
}
function lojaForm(id){
  const s=id?store(id):{nome:"",cidade:"",tipo:"Shopping",quadro:12};
  modal(id?"Editar unidade":"Nova unidade",`<form class="form-grid">
    <div class="field full"><label for="l-nome">Nome da unidade</label><input class="input" id="l-nome" value="${esc(s.nome)}"></div>
    <div class="field"><label for="l-cid">Cidade/UF</label><input class="input" id="l-cid" value="${esc(s.cidade)}"></div>
    <div class="field"><label for="l-tipo">Formato</label><select class="input" id="l-tipo">${["Shopping","Loja de rua","Outlet","Quiosque","Centro de distribuição"].map(x=>`<option ${x===s.tipo?"selected":""}>${x}</option>`).join("")}</select></div>
    <div class="field"><label for="l-quadro">Quadro ideal (pessoas)</label><input class="input num" id="l-quadro" type="number" min="1" value="${s.quadro}"></div>
  </form>`,`<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" data-saveloja="${id||""}">Salvar unidade</button>`);
}
function vagaForm(){
  modal("Abrir vaga",`<form class="form-grid">
    <div class="field"><label for="v-cargo">Cargo</label><select class="input" id="v-cargo">${cargoOpts("Vendedor(a)")}</select></div>
    <div class="field"><label for="v-loja">Unidade</label><select class="input" id="v-loja">${lojaOpts("s1",false)}</select></div>
    <div class="field"><label for="v-qtd">Posições</label><input class="input num" id="v-qtd" type="number" min="1" value="1"></div>
    <div class="field"><label for="v-tipo">Contrato</label><select class="input" id="v-tipo"><option>Efetivo</option><option>Temporário</option><option>Aprendiz</option><option>Intermitente</option></select></div>
  </form>`,`<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" data-act="salvarVaga">Abrir vaga</button>`);
}

boot();
</script>
</body>
</html>
