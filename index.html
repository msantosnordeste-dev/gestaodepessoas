<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%230B7F4A%22/%3E%3Cpath d=%22M6 10h12l-1.2 8H7.2z%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222%22/%3E%3C/svg%3E">
<title>Gestão de Pessoas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: sidebar fixa + área de trabalho em cartões arredondados; vira barra superior rolável no celular.
   Paleta verde Brasileiríssima — verde-bandeira, superfícies brancas, cantos generosos, botões em pílula. */
:root{
  --brand:#0B7F4A; --brand-ink:#075E36; --brand-soft:#DCF3E6; --brand-tint:#F0FAF4; --on-brand:#FFFFFF; --accent:#F2C230;
  --bg:#F2F6F3; --surface:#FFFFFF; --surface-2:#F6F9F7; --ink:#10201A; --muted:#5B6D64; --line:#DFE8E3;
  --ok:#0E7F86; --ok-soft:#DDF2F3; --warn:#B86E00; --warn-soft:#FFF2DC; --bad:#CF2B45; --bad-soft:#FDE6EA;
  --info:#3A5BD9; --info-soft:#E8EDFD;
  --shadow:0 1px 2px rgba(16,32,26,.05),0 8px 24px rgba(16,32,26,.06);
  --f-display:"Sora",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-lg:24px; --r-md:16px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#3DCB86; --brand-ink:#8FE6B8; --brand-soft:#123826; --brand-tint:#0F261B; --on-brand:#06140D; --accent:#F5CE4E;
  --bg:#0C1410; --surface:#141E19; --surface-2:#1A2620; --ink:#EAF4EE; --muted:#9AAFA4;
  --line:#25352C; --ok:#4FCFD4; --ok-soft:#10302F; --warn:#F2A93B; --warn-soft:#352610; --bad:#FF6B81; --bad-soft:#3A1720;
  --info:#8EA6FF; --info-soft:#1C2445; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#3DCB86; --brand-ink:#8FE6B8; --brand-soft:#123826; --brand-tint:#0F261B; --on-brand:#06140D; --accent:#F5CE4E;
  --bg:#0C1410; --surface:#141E19; --surface-2:#1A2620; --ink:#EAF4EE; --muted:#9AAFA4;
  --line:#25352C; --ok:#4FCFD4; --ok-soft:#10302F; --warn:#F2A93B; --warn-soft:#352610; --bad:#FF6B81; --bad-soft:#3A1720;
  --info:#8EA6FF; --info-soft:#1C2445; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:clamp(1.6rem,1.2rem + 1.4vw,2.2rem);font-weight:700}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}

.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:20px;padding:24px 16px;border-right:1px solid var(--line);background:var(--surface)}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px;font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:-.03em}
.logo-mark{width:34px;height:34px;border-radius:11px;background:var(--brand);display:grid;place-items:center;color:var(--on-brand)}
.logo small{display:block;font-family:var(--f-body);font-weight:500;font-size:.72rem;color:var(--muted);letter-spacing:0}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 12px 4px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a svg{width:18px;height:18px;flex:none;stroke:var(--muted)}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.nav a.on svg{stroke:var(--brand)}
.nav .count{margin-left:auto;font-size:.72rem;background:var(--brand);color:var(--on-brand);border-radius:99px;padding:1px 7px;font-weight:700}
.side-foot{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px;border-radius:var(--r-md);background:var(--surface-2)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.8rem;background:var(--brand-soft);color:var(--brand-ink);flex:none}
.side-foot b{display:block;font-size:.85rem}
.side-foot span{font-size:.75rem;color:var(--muted)}

.main{min-width:0;padding-block:28px 64px;padding-inline:clamp(16px,3vw,40px);display:flex;flex-direction:column;gap:24px}
.topbar{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.topbar .eyebrow{font-size:.78rem;color:var(--muted);font-weight:500;margin-bottom:4px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 18px;border-radius:99px;font-weight:600;cursor:pointer;font-size:.9rem;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn-primary:hover{filter:brightness(.92)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-sm{padding:6px 12px;font-size:.8rem}
.btn-danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.icon-btn{width:40px;height:40px;padding:0;justify-content:center}

.banner{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 18px;border-radius:var(--r-md);background:var(--brand-tint);border:1px dashed var(--brand);font-size:.88rem}
.banner b{color:var(--brand-ink)}

.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.two{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.card{background:var(--surface);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.card-head p{color:var(--muted);font-size:.85rem}
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .lbl{font-size:.82rem;color:var(--muted);font-weight:500}
.kpi .val{font-family:var(--f-display);font-size:1.8rem;font-weight:700;letter-spacing:-.03em}
.kpi .sub{font-size:.8rem;color:var(--muted)}
.kpi.hero{background:var(--brand);color:var(--on-brand);background-image:linear-gradient(135deg,transparent 70%,color-mix(in srgb,var(--accent) 35%,transparent))}
.kpi.hero .lbl,.kpi.hero .sub{color:inherit;opacity:.85}

.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.75rem;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-ok{background:var(--ok-soft);color:var(--ok)}
.c-warn{background:var(--warn-soft);color:var(--warn)}
.c-bad{background:var(--bad-soft);color:var(--bad)}
.c-info{background:var(--info-soft);color:var(--info)}
.c-brand{background:var(--brand-soft);color:var(--brand-ink)}
.c-mute{background:var(--surface-2);color:var(--muted)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.78rem;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;min-width:0;width:100%}
.input:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
.toolbar .input{width:auto}
.search{flex:1 1 220px}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem}
.check input{accent-color:var(--brand);width:18px;height:18px}

.table-wrap{overflow-x:auto;margin:0 -22px;padding:0 22px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
tfoot td{font-weight:700;border-bottom:none}
.who{display:flex;align-items:center;gap:10px}
.who b{display:block;font-weight:600}
.who span{font-size:.78rem;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.82rem}

/* alertas */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:var(--r-md);background:var(--surface-2)}
.alert .dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-family:var(--f-display);font-size:.8rem}
.alert b{display:block;font-size:.88rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert span{font-size:.78rem;color:var(--muted)}

/* barras */
.bars{display:flex;flex-direction:column;gap:14px}
.bar-row{display:grid;grid-template-columns:150px minmax(0,1fr) 64px;gap:12px;align-items:center;font-size:.85rem}
.bar-row .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.bar-track{position:relative;height:14px;background:var(--surface-2);border-radius:99px}
.bar-fill{position:absolute;inset:0 auto 0 0;background:var(--brand);border-radius:99px}
.bar-fill.under{background:var(--warn)}
.bar-mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px}
.legend{display:flex;gap:16px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.cols{display:flex;align-items:flex-end;gap:14px;height:170px;padding-top:10px;border-bottom:1px solid var(--line)}
.col-g{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.col-pair{display:flex;gap:4px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.col-pair div{width:min(18px,40%);border-radius:6px 6px 2px 2px;position:relative}
.col-pair div span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:.7rem;color:var(--muted)}
.col-lbls{display:flex;gap:14px}
.col-lbls span{flex:1;text-align:center;font-size:.75rem;color:var(--muted);padding-top:6px}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}
.lane{background:var(--surface-2);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:10px;min-height:200px}
.lane-h{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:.88rem;padding:2px 4px 6px}
.lane-h small{color:var(--muted);font-weight:500;font-size:.72rem;display:block}
.k-card{background:var(--surface);border-radius:var(--r-md);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.k-card b{font-size:.92rem}
.k-card .meta{font-size:.78rem;color:var(--muted)}
.k-card .acts{display:flex;gap:6px;flex-wrap:wrap}

/* escala */
.sched td{text-align:center;padding:8px 6px}
.sched td:first-child{text-align:left}
.cell{width:42px;height:34px;border-radius:10px;border:none;font-weight:700;cursor:pointer;font-size:.8rem}
.cell.T{background:var(--brand-soft);color:var(--brand-ink)}
.cell.F{background:var(--ok-soft);color:var(--ok)}
.cell.FE{background:var(--info-soft);color:var(--info);cursor:default}
.sched th.sun{color:var(--brand)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(8,20,14,.45);display:grid;place-items:center;padding:16px;z-index:50;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:var(--r-lg);width:min(720px,100%);max-height:min(88vh,900px);display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.25)}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line)}
.modal-b{padding:20px 24px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.modal-f{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kv div{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px}
.kv span{display:block;font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kv b{font-weight:600}
.slip{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.slip-row{display:grid;grid-template-columns:minmax(0,1fr) 90px 120px 120px;gap:8px;padding:9px 14px;font-size:.86rem;border-bottom:1px solid var(--line)}
.slip-row:last-child{border-bottom:none}
.slip-row.h{background:var(--surface-2);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.slip-row.t{font-weight:700;background:var(--brand-tint)}
.slip-row span:not(:first-child){text-align:right}
.total-box{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-radius:var(--r-md);background:var(--brand);color:var(--on-brand)}
.total-box b{font-family:var(--f-display);font-size:1.5rem}
.note{font-size:.8rem;color:var(--muted);background:var(--surface-2);padding:10px 12px;border-radius:var(--r-sm)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:99px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:7px 14px;border-radius:99px;font-weight:600;font-size:.82rem;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-weight:600;font-size:.9rem;z-index:80;box-shadow:var(--shadow)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.store-cards{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.store{display:flex;flex-direction:column;gap:14px}
.store-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.store-top span{font-size:.8rem;color:var(--muted)}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini-stats div{background:var(--surface-2);border-radius:12px;padding:8px 10px}
.mini-stats span{display:block;font-size:.7rem;color:var(--muted)}
.mini-stats b{font-family:var(--f-display);font-size:1.05rem}
.tabs-inline{display:flex;gap:8px;flex-wrap:wrap}

/* ficha de registro */
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:36px 20px;border:2px dashed var(--brand);border-radius:var(--r-md);background:var(--brand-tint);cursor:pointer;text-align:center}
.drop b{color:var(--brand-ink)}
.drop span{font-size:.85rem;color:var(--muted)}
.drop.over{background:var(--brand-soft)}
.input.vazio{border:1.5px dashed var(--warn);background:var(--warn-soft)}
.fx-sec{border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px 16px;margin:0 0 14px;min-width:0}
.fx-sec legend{font-family:var(--f-display);font-weight:600;font-size:.9rem;padding:0 6px}
.deps{display:flex;flex-direction:column;gap:8px}
.dep-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1.2fr) minmax(0,1.2fr) auto auto;gap:6px;align-items:center}
.fx-view{border-top:1px solid var(--line);padding:10px 0}
.fx-view summary{cursor:pointer;font-weight:600;margin-bottom:8px}
@media (max-width:860px){.dep-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
/* headcount */
.hc-filtro{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:99px;font-weight:600;font-size:.84rem;cursor:pointer}
.pill:hover{border-color:var(--brand)}
.pill.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}
.hc-row:hover .bar-fill{filter:brightness(1.12)}
.hc-cel{background:color-mix(in srgb,var(--brand) var(--a),transparent);font-weight:600}
.hc-matriz th,.hc-matriz td{padding:9px 10px}
.hc-matriz tfoot tr.muted td{font-weight:500;color:var(--muted)}
.lojas-check{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:6px 0}
/* entrada e sincronização */
.app.gated{grid-template-columns:minmax(0,1fr)}
.app.gated .side{display:none}
.app.gated .main{padding:0;gap:0}
.gate-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);min-height:100vh}
.gate-side{background:var(--brand);color:var(--on-brand);padding:40px clamp(24px,4vw,56px);display:flex;flex-direction:column;justify-content:space-between;gap:32px;position:relative;overflow:hidden}
.gate-side::after{content:"";position:absolute;width:360px;height:360px;border-radius:50%;background:var(--accent);opacity:.22;right:-130px;bottom:-130px;pointer-events:none}
.gate-side::before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;border:2px solid currentColor;opacity:.12;right:60px;top:-60px;pointer-events:none}
.gs-top{display:flex;gap:12px;align-items:center;position:relative;z-index:1}
.gs-top b{display:block;font-family:var(--f-display);font-size:1.2rem;font-weight:800;letter-spacing:-.02em}
.gs-top span{font-size:.8rem;opacity:.85}
.gs-logo{background:var(--on-brand);color:var(--brand);width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.gs-mid{position:relative;z-index:1}
.gs-mid h2{font-size:clamp(1.6rem,1.1rem + 1.6vw,2.4rem);font-weight:700;color:inherit;max-width:15ch;margin-bottom:22px;line-height:1.15}
.gs-mid ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.gs-mid li{display:flex;gap:10px;align-items:center;font-weight:500}
.gs-mid li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.gs-foot{font-size:.78rem;opacity:.8;position:relative;z-index:1}
.gate-main{display:flex;align-items:center;justify-content:center;padding:32px 16px;background:var(--bg)}
.gate{max-width:440px;width:100%;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:36px 32px;display:flex;flex-direction:column;gap:16px}
.gate h1{font-size:1.65rem}
.gate p{max-width:46ch}
.gate-brand{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--brand);font-weight:700}
.gate form{width:100%}
.gate .form-grid{grid-template-columns:minmax(0,1fr)}
.gate .btn-primary{padding:12px 18px;font-size:.95rem}
.gate-acts{display:flex;flex-direction:column;gap:10px;width:100%}
.gate-acts .btn{justify-content:center}
@media (max-width:860px){
  .gate-wrap{grid-template-columns:minmax(0,1fr);min-height:0}

<script>
/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=v=>(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const n0=v=>(v||0).toLocaleString("pt-BR",{maximumFractionDigits:0});
const pct=v=>(v||0).toLocaleString("pt-BR",{maximumFractionDigits:1})+"%";
const r2=v=>Math.round(v*100)/100;
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const fdate=s=>s?parse(s).toLocaleDateString("pt-BR"):"—";
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const addMonths=(s,n)=>{const d=parse(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const monthsBetween=(a,b)=>{const A=parse(a),B=parse(b);let m=(B.getFullYear()-A.getFullYear())*12+B.getMonth()-A.getMonth();if(B.getDate()<A.getDate())m--;return m};
const TODAY=iso(new Date());
const initials=n=>n.split(" ").filter(Boolean).slice(0,2).map(p=>p[0]).join("").toUpperCase();
const uid=()=>Math.random().toString(36).slice(2,9);
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const compLabel=c=>{const [y,m]=c.split("-").map(Number);return MESES[m-1][0].toUpperCase()+MESES[m-1].slice(1)+"/"+y};

/* ============ tabelas legais (editáveis em Configurações) ============ */
const DEFAULT_CFG={
  salarioMinimo:1621,
  inss:[[1621,7.5],[2902.84,9],[4354.27,12],[8475.55,14]],
  irrf:[[2428.80,0,0],[2826.65,7.5,182.16],[3751.05,15,394.16],[4664.68,22.5,675.49],[Infinity,27.5,908.73]],
  deducaoDependente:189.59, descontoSimplificado:607.20,
  reducaoAte:5000, reducaoMax:312.89, reducaoFaixaAte:7350, reducaoA:978.62, reducaoB:0.133145,
  fgts:8, vtPct:6,
  beneficios:{alimentacao:480, refeicao:31, mobilidadeDia:9.4, bemestar:60}
};

/* ============ dados de exemplo ============ */
function rngFrom(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const CARGOS={
  "Gerente de loja":{sal:[4600,5400],com:0},
  "Subgerente":{sal:[2800,3200],com:0},
  "Vendedor(a)":{sal:[1650,1850],com:[2,3]},
  "Operador(a) de caixa":{sal:[1680,1780],com:0},
  "Fiscal de prevenção":{sal:[1850,1950],com:0},
  "Estoquista":{sal:[1680,1760],com:0},
  "Visual merchandiser":{sal:[2500,2800],com:0},
  "Supervisor(a) de CD":{sal:[4100,4500],com:0},
  "Auxiliar de logística":{sal:[1680,1760],com:0}
};
function fakeAval(e,marco,parecer,avaliador,R,piso){
  const notas={};criterios(e.cargo).forEach(c=>notas[c.k]=Math.max(1,Math.min(5,Math.round(piso+R()*2))));
  const media=mediaNotas(notas);
  return {id:uid(),marco,data:addDays(e.admissao,marco-3-Math.floor(R()*4)),avaliador,notas,media,faltas:Math.floor(R()*(parecer==="encerrar"?5:2)),atrasos:Math.floor(R()*3),
    fortes:media>=4?"Boa abordagem com clientes e rapidez para aprender o mix da loja.":media>=3?"Pontual e colaborativo(a) com a equipe.":"Disposição para aprender.",
    desenvolver:media>=4?"Ganhar autonomia em trocas e devoluções.":media>=3?"Melhorar conhecimento de produto e venda adicional.":"Pontualidade, postura no salão e cumprimento de procedimentos.",parecer};
}
function seedData(){
  const R=rngFrom(2026),pick=a=>a[Math.floor(R()*a.length)],between=(a,b)=>a+R()*(b-a);
  const F=["Ana","Bruno","Camila","Diego","Eduarda","Felipe","Gabriela","Henrique","Isabela","João","Karina","Lucas","Mariana","Natália","Otávio","Paula","Rafael","Sabrina","Thiago","Vanessa","Wesley","Yasmin","Larissa","Matheus","Priscila","Rodrigo","Tainá","Caio","Jéssica","Leonardo","Bianca","Gustavo","Amanda","Igor","Letícia","Renan","Juliana","Pedro","Débora","Vinícius","Aline","Marcelo","Fernanda","Danilo","Raíssa","Samuel","Clara","Davi"];
  const L=["Silva","Santos","Oliveira","Souza","Lima","Pereira","Ferreira","Costa","Rodrigues","Almeida","Nascimento","Carvalho","Araújo","Ribeiro","Barbosa","Cavalcanti","Monteiro","Freitas","Batista","Moura","Teixeira","Rocha","Correia","Brito"];
  const stores=[
    {id:"s1",nome:"Brasileiríssima Centro",cidade:"Recife/PE",tipo:"Loja de rua",quadro:12},
    {id:"s2",nome:"Brasileiríssima Boa Viagem",cidade:"Recife/PE",tipo:"Shopping",quadro:14},
    {id:"s3",nome:"Brasileiríssima Iguatemi",cidade:"Fortaleza/CE",tipo:"Shopping",quadro:13},
    {id:"s4",nome:"Brasileiríssima Salvador",cidade:"Salvador/BA",tipo:"Shopping",quadro:12},
    {id:"s5",nome:"Brasileiríssima Natal Sul",cidade:"Natal/RN",tipo:"Shopping",quadro:10},
    {id:"s6",nome:"CD Cabo",cidade:"Cabo de Sto. Agostinho/PE",tipo:"Centro de distribuição",quadro:10}
  ];
  const mix={loja:["Gerente de loja","Subgerente","Vendedor(a)","Vendedor(a)","Vendedor(a)","Vendedor(a)","Vendedor(a)","Operador(a) de caixa","Operador(a) de caixa","Fiscal de prevenção","Estoquista","Visual merchandiser","Vendedor(a)"],
    cd:["Supervisor(a) de CD","Auxiliar de logística","Auxiliar de logística","Auxiliar de logística","Auxiliar de logística","Auxiliar de logística","Estoquista","Estoquista","Auxiliar de logística"]};
  const used=new Set(),emps=[];
  const name=()=>{let n;do{n=pick(F)+" "+pick(L)+" "+pick(L)}while(used.has(n));used.add(n);return n};
  stores.forEach((s,si)=>{
    const roles=s.tipo==="Centro de distribuição"?mix.cd:mix.loja.slice(0,s.quadro-(si%3===0?2:si%3===1?0:1));
    roles.forEach((cargo,ri)=>{
      const c=CARGOS[cargo];
      let adm;
      const roll=R();
      if(roll<.12) adm=addDays(TODAY,-Math.floor(between(8,85)));
      else adm=addDays(TODAY,-Math.floor(between(200,2900)));
      if(cargo==="Gerente de loja"||cargo==="Supervisor(a) de CD") adm=addDays(TODAY,-Math.floor(between(1500,3200)));
      const sal=Math.round(between(c.sal[0],c.sal[1])/10)*10;
      const e={id:uid(),nome:name(),cpf:"•••.•••.•••-"+pad(Math.floor(R()*99)),cargo,lojaId:s.id,admissao:adm,salario:sal,
        dependentes:R()<.4?Math.ceil(R()*2):0,vt:R()<.7,comissao:c.com?r2(between(c.com[0],c.com[1])):0,
        vendas:c.com?Math.round(between(32000,92000)/100)*100:0,he:R()<.3?Math.round(between(2,14)):0,
        banco:Math.round(between(-240,2600)),afastado:false,desligado:null,ferias:[],avaliacoes:[]};
      // ASO periódico: vencimento anual a partir do último exame
      const mAdm=monthsBetween(adm,TODAY);
      let aso=addMonths(adm,12*Math.max(1,Math.ceil(mAdm/12)));
      if(R()<.18) aso=addDays(TODAY,Math.floor(between(-20,28)));
      e.aso=aso;
      // férias: períodos completos e quantos foram gozados
      const completos=Math.floor(mAdm/12);
      let pend=completos===0?0:(R()<.55?1:0);
      if(completos>=2&&R()<.06) pend=2;
      const gozados=Math.max(0,completos-pend);
      for(let k=0;k<gozados;k++) e.ferias.push({inicio:addMonths(adm,12*(k+1)+Math.floor(between(2,9))),dias:30,abono:false});
      if(R()<.07&&completos>0&&pend>0){e.ferias.push({inicio:addDays(TODAY,-Math.floor(between(2,12))),dias:30,abono:false})}
      if(R()<.04&&mAdm>12) e.afastado=true;
      emps.push(e);
    });
  });
  // desligados nos últimos 12 meses (para turnover)
  const tipos=["sem_justa","pedido","pedido","acordo","sem_justa","fim_experiencia","pedido","justa","sem_justa"];
  tipos.forEach((t,i)=>{const s=stores[i%5];const cargo=i%3===0?"Operador(a) de caixa":"Vendedor(a)";const c=CARGOS[cargo];
    const deslig=addDays(TODAY,-Math.floor(between(10,350)));
    emps.push({id:uid(),nome:name(),cpf:"•••.•••.•••-"+pad(Math.floor(R()*99)),cargo,lojaId:s.id,admissao:addDays(deslig,-Math.floor(between(60,900))),
      salario:Math.round(between(c.sal[0],c.sal[1])/10)*10,dependentes:0,vt:true,comissao:c.com?2.5:0,vendas:0,he:0,banco:0,afastado:false,
      desligado:{data:deslig,tipo:t},ferias:[],aso:deslig,avaliacoes:[]});
  });
  // avaliações de experiência de exemplo
  emps.forEach(e=>{
    if(!e.avaliacoes)e.avaliacoes=[];
    const gest=emps.find(g=>g.lojaId===e.lojaId&&/Gerente|Supervisor/.test(g.cargo)&&g!==e);
    const quem=gest?gest.nome:"Gestão de Pessoas";
    const fim=e.desligado?e.desligado.data:TODAY;const dx=diffDays(e.admissao,fim);
    if(e.desligado&&e.desligado.tipo==="fim_experiencia"){e.admissao=addDays(e.desligado.data,-89);e.avaliacoes.push(fakeAval(e,45,"prorrogar",quem,R,2.6),fakeAval(e,90,"encerrar",quem,R,1.6));return}
    if(e.desligado) return;
    if(dx<90){if(dx>=46&&R()<.8)e.avaliacoes.push(fakeAval(e,45,"prorrogar",quem,R,R()<.25?2.4:3))}
    else if(dx<=400){e.avaliacoes.push(fakeAval(e,45,"prorrogar",quem,R,3),fakeAval(e,90,"efetivar",quem,R,3.2));e.efetivado=true}
  });
  const S=id=>stores.find(s=>s.id===id);
  const admissoes=[
    {id:uid(),nome:"Helena Duarte Paiva",cargo:"Vendedor(a)",lojaId:"s2",salario:1700,etapa:0,inicio:addDays(TODAY,12),obs:"Temporária Natal · 90 dias"},
    {id:uid(),nome:"Ícaro Melo Tavares",cargo:"Vendedor(a)",lojaId:"s3",salario:1700,etapa:0,inicio:addDays(TODAY,15),obs:"Temporário Black Friday"},
    {id:uid(),nome:"Joana Prado Leite",cargo:"Operador(a) de caixa",lojaId:"s4",salario:1700,etapa:1,inicio:addDays(TODAY,9),obs:"ASO agendado"},
    {id:uid(),nome:"Kleber Aragão Neto",cargo:"Auxiliar de logística",lojaId:"s6",salario:1700,etapa:1,inicio:addDays(TODAY,7),obs:""},
    {id:uid(),nome:"Lívia Campos Rêgo",cargo:"Visual merchandiser",lojaId:"s5",salario:2600,etapa:2,inicio:addDays(TODAY,5),obs:"Contrato de experiência 45+45"},
    {id:uid(),nome:"Murilo Sá Fontes",cargo:"Estoquista",lojaId:"s1",salario:1700,etapa:3,inicio:addDays(TODAY,3),obs:"Aguardando recibo S-2200"}
  ];
  const vagas=[
    {id:uid(),cargo:"Vendedor(a)",lojaId:"s2",qtd:4,tipo:"Temporário",abertura:addDays(TODAY,-18),candidatos:63,status:"Entrevistas"},
    {id:uid(),cargo:"Vendedor(a)",lojaId:"s3",qtd:3,tipo:"Temporário",abertura:addDays(TODAY,-12),candidatos:41,status:"Triagem"},
    {id:uid(),cargo:"Operador(a) de caixa",lojaId:"s4",qtd:2,tipo:"Efetivo",abertura:addDays(TODAY,-25),candidatos:37,status:"Entrevistas"},
    {id:uid(),cargo:"Auxiliar de logística",lojaId:"s6",qtd:3,tipo:"Temporário",abertura:addDays(TODAY,-6),candidatos:22,status:"Triagem"},
    {id:uid(),cargo:"Subgerente",lojaId:"s5",qtd:1,tipo:"Efetivo",abertura:addDays(TODAY,-40),candidatos:14,status:"Proposta"},
    {id:uid(),cargo:"Fiscal de prevenção",lojaId:"s1",qtd:1,tipo:"Efetivo",abertura:addDays(TODAY,-3),candidatos:9,status:"Divulgação"}
  ];
  const eventos=[];
  emps.filter(e=>e.desligado&&diffDays(e.desligado.data,TODAY)<60).forEach(e=>eventos.push({id:uid(),codigo:"S-2299",desc:"Desligamento",ref:e.nome,data:e.desligado.data,status:"Transmitido"}));
  emps.filter(e=>!e.desligado&&diffDays(e.admissao,TODAY)<60).forEach(e=>eventos.push({id:uid(),codigo:"S-2200",desc:"Admissão",ref:e.nome,data:addDays(e.admissao,-1),status:"Transmitido"}));
  emps.filter(e=>e.afastado).forEach(e=>eventos.push({id:uid(),codigo:"S-2230",desc:"Afastamento temporário",ref:e.nome,data:addDays(TODAY,-20),status:"Pendente"}));
  eventos.push({id:uid(),codigo:"S-1200",desc:"Remuneração "+compLabel(addMonths(TODAY,-1).slice(0,7)),ref:"Todas as unidades",data:addDays(TODAY,-Number(TODAY.slice(8))+5),status:"Transmitido"});
  return {exemplo:true,stores,emps,admissoes,vagas,eventos,escalaOverrides:{},folhasFechadas:{},recargas:[],cfg:JSON.parse(JSON.stringify(DEFAULT_CFG))};
}

/* ============ estado ============ */
const KEY="vitrine-rh-v1";
let ST;
/* ---- banco de dados (Supabase) ----
   lojas, colaboradores (dados operacionais), colaboradores_privado (CPF, salário, ficha: só RH),
   escalas, admissoes, rh_estado (vagas, eSocial, benefícios, configurações), solicitacoes, log_acesso, perfis.
   As regras de acesso por perfil e por loja ficam no próprio banco (supabase/schema.sql). */
const CONF=window.GP_CONFIG||{};
const DOMINIO="usuarios.gestaodepessoas.app";
let SB=null,ROLE=null,PERFIL=null,SESSION=null;
let MOVS=[],SOLIC=[],SOLIC_ALL=[],MSGS=[],RT=null,RT_T=null,USUARIOS=[],LOGV=null,BASE_G=null,PEND_RENDER=false;
const ESC_T={};
const LAST={};let SALVANDO=0,SYNC="ok",FILA=Promise.resolve();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clone=o=>JSON.parse(JSON.stringify(o));
const PERFIS={rh:"RH · acesso total",gerente:"Gerente de loja"};
function normalize(o){
  if(o.cfg&&o.cfg.irrf)o.cfg.irrf.forEach(f=>{if(f[0]===null)f[0]=Infinity});
  o.emps.forEach(e=>{if(!e.avaliacoes)e.avaliacoes=[];if(!e.ferias)e.ferias=[]});
  o.stores.forEach(s=>{s.nome=s.nome.replace(/^Aurora /,"Brasileiríssima ")});
  o.escalaOverrides=o.escalaOverrides||{};delete o.acessos;delete o.usuarios;
  ["admissoes","vagas","eventos","recargas","desligProg","pjs","xpChamados","mensagens"].forEach(k=>{o[k]=o[k]||[]});o.folhasFechadas=o.folhasFechadas||{};
  return o;
}
function save(){notificarMovimentos();persist()}
function logEvento(evento,detalhe){
  if(!SB||!SESSION)return;
  SB.from("log_acesso").insert({login:SESSION.login,nome:SESSION.nome,perfil:SESSION.perfil,evento,detalhe:String(detalhe||"").slice(0,300)}).then(()=>{},()=>{});
}
async function tudo(t,ordem){
  let out=[],de=0;
  for(;;){let q=SB.from(t).select("*");if(ordem)q=q.order(ordem);const {data,error}=await q.range(de,de+999);if(error)throw error;out=out.concat(data);if(data.length<1000)return out;de+=1000}
}

/* ---- gravação: compara com o que já está no banco e envia só o que mudou ---- */
const PUB=["nome","cargo","lojaId","admissao","aso","banco","he","afastado","desligado","ferias","avaliacoes","efetivado"];
const PK={lojas:"id",colaboradores:"id",colaboradores_privado:"id",escalas:"chave",admissoes:"id",rh_estado:"id",prestadores:"id"};
const ORDEM=["lojas","colaboradores","colaboradores_privado","escalas","admissoes","rh_estado","prestadores"];
function setSync(s){SYNC=s;const el=document.getElementById("sync");if(el){el.textContent=s==="saving"?"Salvando…":s==="error"?"Erro ao salvar":"Tudo salvo";el.className="sync "+s}}
function linhas(){
  const pub=e=>{const o={};PUB.forEach(k=>{if(e[k]!==undefined)o[k]=e[k]});return o};

function persist(){
  if(ROLE!=="rh"||!SB||!ST)return;
  const L=linhas();const ops=[];
  ORDEM.forEach(t=>{
    const cur=new Map(L[t].map(([k,o])=>[k,JSON.stringify(o)]));const ant=LAST[t]||new Map();
    const up=[];cur.forEach((j,k)=>{if(ant.get(k)!==j)up.push(JSON.parse(j))});
    const del=[...ant.keys()].filter(k=>!cur.has(k));
    if(up.length||del.length)ops.push({t,up,del});
    LAST[t]=cur;
  });
  if(!ops.length)return;
  SALVANDO++;setSync("saving");
  FILA=FILA.then(async()=>{
    let falha=null;
    const tentar=async fn=>{let r=await fn();if(r.error){await sleep(800);r=await fn()}if(r.error)falha=r.error};
    for(const o of ops)for(let i=0;i<o.up.length;i+=500){const lote=o.up.slice(i,i+500);await tentar(()=>SB.from(o.t).upsert(lote,{onConflict:PK[o.t]}))}
    for(const o of [...ops].reverse())if(o.del.length)await tentar(()=>SB.from(o.t).delete().in(PK[o.t],o.del));
    SALVANDO--;
    if(falha){ORDEM.forEach(t=>delete LAST[t]);setSync("error");console.error(falha);toast("Uma alteração não foi salva. Verifique a conexão e recarregue a página.")}
    else setSync(SALVANDO?"saving":"ok");
  });
}

/* aplica um registro do gerente; devolve texto de erro ou null */
function aplicarMov(m,lojaId,local){
  const e=m.eid?ST.emps.find(x=>x.id===m.eid):null;
  if(m.eid&&(!e||e.lojaId!==lojaId))return "Colaborador não pertence a esta loja";
  if(m.tipo==="avaliacao"){
    const a=m.av||{};
    if(![45,90].includes(a.marco)||!PARECER[a.parecer]||(a.marco===90&&a.parecer==="prorrogar"))return "Avaliação inválida";
    if(e.avaliacoes.some(x=>x.marco===a.marco&&!x.pendente))return "Já existe avaliação deste marco";
    const notas={};criterios(e.cargo).forEach(c=>{const n=Math.round(Number((a.notas||{})[c.k]));if(n>=1&&n<=5)notas[c.k]=n});
    const txt=v=>String(v||"").slice(0,1000);
    const av={id:a.id||uid(),marco:a.marco,data:/^\d{4}-\d{2}-\d{2}$/.test(a.data||"")?a.data:TODAY,avaliador:txt(a.avaliador),notas,media:mediaNotas(notas),
      faltas:Math.max(0,Number(a.faltas)||0),atrasos:Math.max(0,Number(a.atrasos)||0),fortes:txt(a.fortes),desenvolver:txt(a.desenvolver),parecer:a.parecer};
    if(local){av.pendente=true;e.avaliacoes.push(av)}else aplicarAvaliacao(e,av);
    return null;
  }
  if(m.tipo==="escala"){
    const k=String(m.key||"").split("|");
    if(k.length!==3||k[0]!==lojaId||k[2]!==m.eid||!Array.isArray(m.dias)||m.dias.length!==7)return "Escala inválida";
    ST.escalaOverrides[m.key]=m.dias.map(x=>x==="F"?"F":"T");return null;
  }
  if(m.tipo==="banco"){const v=Number(m.min);if(!isFinite(v)||Math.abs(v)>720)return "Lançamento inválido";e.banco+=v;return null}
  if(m.tipo==="aso"){if(!/^\d{4}-\d{2}-\d{2}$/.test(m.data||""))return "Data inválida";e.aso=m.data;return null}
  if(m.tipo==="ferias_assinada"){const f=e.ferias.find(x=>x.inicio===m.ini);if(!f)return "Férias não encontradas";if(local)f.assinadoPend=true;else{f.assinado=String(m.em||TODAY).slice(0,10);delete f.assinadoPend}return null}
  return "Tipo de registro desconhecido";
}
function aplicarAvaliacao(e,a){
  e.avaliacoes=e.avaliacoes.filter(x=>!(x.marco===a.marco&&x.pendente));e.avaliacoes.push(a);
  const nome=e.nome.split(" ")[0];

function marcos(e){

    if(a) st=a.pendente?{t:"Enviada · aguardando RH",c:"c-warn"}:PARECER[a.parecer];

    else if(dias<0){st={t:m===45?"Atrasada · prorrogação em risco":"Prazo vencido · contrato indeterminado",c:"c-bad"};pend=true}
    else if(dias<=10){st={t:dias===0?"Vence hoje":"Vence em "+dias+(dias===1?" dia":" dias"),c:"c-warn"};pend=true}
    else st={t:"Em "+dias+" dias",c:"c-mute"};

/* períodos de férias concluídos: lançamentos com "aquisitivo" são somados por período (frações e abono de 10 dias);
   lançamentos antigos sem período contam um período cada */
function feriasConcluidas(e){
  const g={};let leg=0;
  (e.ferias||[]).forEach(f=>{if(!f.aquisitivo){leg++;return}const p=g[f.aquisitivo]||(g[f.aquisitivo]={d:0,ab:false});p.d+=f.perda?30:Number(f.dias)||0;if(f.abono)p.ab=true});
  return leg+Object.values(g).filter(p=>p.d+(p.ab?10:0)>=30).length;
}
function situacaoFerias(e){
  const meses=monthsBetween(e.admissao,TODAY);
  const completos=Math.floor(meses/12);
  const gozados=feriasConcluidas(e);
  const pend=Math.max(0,completos-gozados);
  const proxPeriodo=gozados; // índice do período mais antigo não gozado
  const aquisIni=addMonths(e.admissao,12*proxPeriodo);
  const aquisFim=addDays(addMonths(e.admissao,12*(proxPeriodo+1)),-1);
  const limite=addDays(addMonths(e.admissao,12*(proxPeriodo+2)),-1);
  const programada=e.ferias.find(f=>f.inicio>TODAY&&!f.perda);
  let st;
  if(pend>=2) st={t:"Vencida · pagar em dobro",c:"c-bad",ord:0};
  else if(pend===1){const d=diffDays(TODAY,limite);st=d<=90?{t:"Vence em "+d+" dias",c:"c-warn",ord:1}:{t:"Saldo disponível",c:"c-info",ord:2}}
  else st={t:"Em aquisição",c:"c-mute",ord:3};
  if(e.feriasConferir&&pend>0&&!programada) st={t:"Conferir histórico de férias",c:"c-warn",ord:1};
  if(programada) st={t:"Programada "+fdate(programada.inicio),c:"c-ok",ord:4};
  return {pend,aquisIni,aquisFim,limite,st,programada,completos,gozados};
}
function diasMes(comp){const [y,m]=comp.split("-").map(Number);const tot=new Date(y,m,0).getDate();
  const fer=["01-01","04-21","05-01","09-07","10-12","11-02","11-15","11-20","12-25"];
  let dom=0;for(let d=1;d<=tot;d++){const dt=new Date(y,m-1,d);if(dt.getDay()===0||fer.includes(pad(m)+"-"+pad(d)))dom++}
  return {tot,uteis:tot-dom,dsr:dom}}
function calcINSS(base){const t=ST.cfg.inss;let prev=0,v=0;for(const [lim,a] of t){if(base>prev){v+=(Math.min(base,lim)-prev)*a/100}prev=lim}return r2(v)}
function calcIRRF(bruto,inss,dep){
  const c=ST.cfg;const legal=inss+dep*c.deducaoDependente;const ded=Math.max(legal,c.descontoSimplificado);
  const base=Math.max(0,bruto-ded);let imp=0;
  for(const [lim,a,d] of c.irrf){if(base<=lim){imp=base*a/100-d;break}}
  imp=Math.max(0,imp);
  let red=0;if(bruto<=c.reducaoAte)red=Math.min(imp,c.reducaoMax);else if(bruto<=c.reducaoFaixaAte)red=Math.min(imp,Math.max(0,c.reducaoA-c.reducaoB*bruto));
  return {base:r2(base),imp:r2(imp),red:r2(red),valor:r2(Math.max(0,imp-red)),simplificado:c.descontoSimplificado>legal};
}
function folha(e,comp=curComp){
  const dm=diasMes(comp);
  const base=e.salario;

  const inss=calcINSS(bruto);
  const ir=calcIRRF(bruto,inss,e.dependentes||0);
  const vt=e.vt?r2(Math.min(base*ST.cfg.vtPct/100,ST.cfg.beneficios.mobilidadeDia*dm.uteis)):0;

}
function rescisao(e,data,tipo,aviso){
  const sal=e.salario,anos=Math.floor(monthsBetween(e.admissao,data)/12);
  const dia=parse(data).getDate();
  const saldo=r2(sal/30*Math.min(dia,30));
  let diasAviso=0;
  if(tipo==="sem_justa"&&aviso==="indenizado") diasAviso=Math.min(90,30+3*anos);
  if(tipo==="acordo"&&aviso==="indenizado") diasAviso=Math.floor(Math.min(90,30+3*anos)/2);
  const avisoV=r2(sal/30*diasAviso);
  const fimProj=addDays(data,diasAviso);
  const avos=(ini,fim)=>{let m=monthsBetween(ini,fim);const resto=diffDays(addMonths(ini,m),fim);if(resto>=14)m++;return Math.min(12,Math.max(0,m))};

  const a13=avos(e.admissao>ano?e.admissao:ano,fimProj);
  const decimo=tipo==="justa"?0:r2(sal/12*a13);
  const sf=situacaoFerias(e);
  const vencidas=r2(sal*sf.pend*(4/3));
  const ultAniv=addMonths(e.admissao,12*Math.floor(monthsBetween(e.admissao,fimProj)/12));
  const aF=avos(ultAniv,fimProj);
  const propF=tipo==="justa"?0:r2(sal/12*aF*(4/3));
  const meses=Math.max(1,monthsBetween(e.admissao,data));
  const saldoFgts=r2(sal*0.08*meses*1.04);
  const multa=tipo==="sem_justa"?r2(saldoFgts*.4):tipo==="acordo"?r2(saldoFgts*.2):0;
  const linhas=[["Saldo de salário ("+Math.min(dia,30)+" dias)",saldo],["Aviso prévio indenizado ("+diasAviso+" dias)",avisoV],["13º proporcional ("+a13+"/12)",decimo],["Férias vencidas + 1/3 ("+sf.pend+" período"+(sf.pend===1?"":"s")+")",vencidas],["Férias proporcionais + 1/3 ("+aF+"/12)",propF]];
  const total=r2(linhas.reduce((s,l)=>s+l[1],0));
  const saque=tipo==="sem_justa"||tipo==="fim_experiencia"?"100% do saldo":tipo==="acordo"?"80% do saldo":"Sem saque";
  return {linhas,total,saldoFgts,multa,saque,diasAviso,anos};
}

const lojaTemGente=s=>s.quadro>0||ST.emps.some(e=>e.lojaId===s.id&&!e.desligado);
function entradaTransferencia(e){
  const t=String((e.ficha&&e.ficha.fichasAnteriores)||"");if(!t||!e.admissao)return false;
  return t.split("||").some(seg=>{const ds=seg.match(/\d{2}\/\d{2}\/\d{4}/g)||[];const sai=ds[1]?valData(ds[1]):"";return sai&&Math.abs(diffDays(sai,e.admissao))<=3});
}
function calcRotatividade(ids){
  const pool=ST.emps.filter(e=>(!ids||ids.includes(e.lojaId))&&ccOk(e));
  const ativoEm=(e,d)=>e.admissao&&e.admissao<=d&&(!e.desligado||e.desligado.data>d);
  const base=TODAY.slice(0,7)+"-01";
  const meses=[...Array(12)].map((_,i)=>{const ini=addMonths(base,i-11);const fimM=addDays(addMonths(ini,1),-1);return {comp:ini.slice(0,7),ini,fim:fimM>TODAY?TODAY:fimM}});
  const noMes=(d,m)=>d&&d>=m.ini&&d<=m.fim;
  const mensal=meses.map(m=>{
    const hcIni=pool.filter(e=>ativoEm(e,addDays(m.ini,-1))).length,hcFim=pool.filter(e=>ativoEm(e,m.fim)).length;
    const ad=pool.filter(e=>noMes(e.admissao,m)),de=pool.filter(e=>e.desligado&&noMes(e.desligado.data,m));
    const adm=ad.filter(e=>!entradaTransferencia(e)).length,admT=ad.length-adm,des=de.filter(e=>!ehTransf(e)).length,desT=de.length-des;
    const hcMed=(hcIni+hcFim)/2;
    return {...m,hcIni,hcFim,hcMed,adm,admT,des,desT,vol:de.filter(e=>INICIATIVA[e.desligado.tipo]==="empregado").length,turn:hcMed?((adm+des)/2)/hcMed*100:0};
  });
  const ini=meses[0].ini;
  const desl=pool.filter(e=>e.desligado&&e.desligado.data>=ini&&e.desligado.data<=TODAY).sort((a,b)=>b.desligado.data.localeCompare(a.desligado.data));
  const deslReal=desl.filter(e=>!ehTransf(e));
  const soma=k=>mensal.reduce((t,m)=>t+m[k],0);
  const hcMedio=mensal.reduce((t,m)=>t+m.hcMed,0)/12;
  const adm=soma("adm"),des=soma("des");
  const porInic={};deslReal.forEach(e=>{const k=INICIATIVA[e.desligado.tipo]||"empresa";porInic[k]=(porInic[k]||0)+1});
  const porTipo={};desl.forEach(e=>{porTipo[e.desligado.tipo]=(porTipo[e.desligado.tipo]||0)+1});
  const faixas=[["Até 90 dias",0,90],["3 a 6 meses",91,182],["6 a 12 meses",183,365],["1 a 2 anos",366,730],["2 a 5 anos",731,1826],["Mais de 5 anos",1827,1e9]];
  const porTempo=faixas.map(([t,a,b])=>({t,n:deslReal.filter(e=>{const d=diffDays(e.admissao,e.desligado.data);return d>=a&&d<=b}).length}));
  const porCargo={};deslReal.forEach(e=>{porCargo[e.cargo]=(porCargo[e.cargo]||0)+1});
  return {mensal,hcMedio,adm,des,admT:soma("admT"),desT:soma("desT"),vol:porInic.empregado||0,
    turnover:hcMedio?((adm+des)/2)/hcMedio*100:0,taxaDesl:hcMedio?des/hcMedio*100:0,taxaVol:hcMedio?(porInic.empregado||0)/hcMedio*100:0,
    porInic,porTipo,porTempo,porCargo,desl,deslReal,ini};
}

function colabsTela(){

R.ponto=()=>{

  const dias=[...Array(7)].map((_,k)=>addDays(ws,k));
  const list=ativos().filter(e=>e.lojaId===s.id&&ccOk(e));
  const prev=[1,2].map(k=>escalaSemana(s,addDays(ws,-7*k)));
  const rows=list.map(e=>{
    const d=esc_[e.id];const folgas=d.filter(x=>x!=="T").length;
    const domFolga=[d,prev[0][e.id],prev[1][e.id]].some(w=>w&&w[0]!=="T");
    let tr=0,maxTr=0;d.forEach(x=>{tr=x==="T"?tr+1:0;maxTr=Math.max(maxTr,tr)});

function feriasLista(){
  let list=ativos().map(e=>({e,sf:situacaoFerias(e)}));
  list=list.filter(x=>ccOk(x.e));
  if(UI.fLoja)list=list.filter(x=>x.e.lojaId===UI.fLoja);
  if(UI.fBusca){const n=semAcento(UI.fBusca),d=soDig(UI.fBusca);list=list.filter(x=>semAcento([x.e.nome,x.e.cargo,store(x.e.lojaId).nome].join(" ")).includes(n)||(d.length>=3&&soDig(x.e.cpf).includes(d)))}
  if(UI.feriasFiltro==="atencao") list=list.filter(x=>x.sf.st.ord<=1);
  if(UI.feriasFiltro==="programadas") list=list.filter(x=>x.sf.programada||feriasEmCurso(x.e));
  list.sort((a,b)=>a.sf.st.ord-b.sf.st.ord||a.sf.limite.localeCompare(b.sf.limite));
  return list;
}

R.beneficios=()=>{
  const b=ST.cfg.beneficios;const dm=diasMes(curComp);
  const calc=e=>{const diasFe=feriasEmCurso(e)?0:dm.uteis;return {alim:b.alimentacao,ref:b.refeicao*diasFe,mob:e.vt?b.mobilidadeDia*diasFe:0,bem:b.bemestar}};
  const porLoja=ST.stores.map(s=>{const es=ativos().filter(e=>e.lojaId===s.id&&!e.afastado&&ccOk(e));const t=es.reduce((acc,e)=>{const c=calc(e);acc.alim+=c.alim;acc.ref+=c.ref;acc.mob+=c.mob;acc.bem+=c.bem;return acc},{alim:0,ref:0,mob:0,bem:0});return {s,n:es.length,...t,tot:t.alim+t.ref+t.mob+t.bem}});
  const tot=porLoja.reduce((s,x)=>s+x.tot,0);
  const feita=ST.recargas.find(r=>r.comp===curComp);

R.experiencia=()=>{
  const acomp=ativos().filter(e=>!e.efetivado&&diffDays(e.admissao,TODAY)<=100).sort((a,b)=>a.admissao.localeCompare(b.admissao));
  const all=acomp.flatMap(e=>marcos(e));
  const hist=ST.emps.flatMap(e=>(e.avaliacoes||[]).map(a=>({e,a}))).sort((x,y)=>y.a.data.localeCompare(x.a.data));
  const fin=hist.filter(h=>(h.a.marco===90||h.a.parecer!=="prorrogar")&&diffDays(h.a.data,TODAY)<=365);
  const passa=e=>ccOk(e)&&(!UI.xLoja||e.lojaId===UI.xLoja)&&(!UI.xBusca||semAcento([e.nome,e.cargo,store(e.lojaId).nome].join(" ")).includes(semAcento(UI.xBusca))||(soDig(UI.xBusca).length>=3&&soDig(e.cpf).includes(soDig(UI.xBusca))));
  const acompV=acomp.filter(passa),histV=hist.filter(h=>passa(h.e));
  const nV=UI.xpTab==="acomp"?acompV.length:histV.length;
  const taxa=fin.length?fin.filter(h=>h.a.parecer==="efetivar").length/fin.length*100:0;
  const prox=all.filter(m=>m.pend&&m.dias>=0).length,atr=all.filter(m=>m.pend&&m.dias<0).length;
  return header("Pessoas","Período de experiência",`${G()?"":`<button class="btn" data-xpchamado="">Chamado SULTS para líder</button>`}<button class="btn" data-act="pdfExperiencia">Relatório PDF</button>`)+`

    <div class="card kpi"><span class="lbl">Avaliações nos próximos 10 dias</span><span class="val num" style="color:var(--warn)">${prox}</span><span class="sub">feitas pelo gestor da loja</span></div>
    <div class="card kpi"><span class="lbl">Avaliações atrasadas</span><span class="val num" style="color:var(--bad)">${atr}</span><span class="sub">risco de virar prazo indeterminado</span></div>
    <div class="card kpi"><span class="lbl">Taxa de efetivação</span><span class="val num">${pct(taxa)}</span><span class="sub">${fin.length} decisões nos últimos 12 meses</span></div>
  </div>

async function entrar(){
  const login=normLogin($("#l-user").value),senha=$("#l-pass").value;
  if(!login||!senha){erroTela("Preencha usuário e senha.");return}
  const b=$("#btn-entrar");b.disabled=true;b.textContent="Entrando…";
  const {error}=await SB.auth.signInWithPassword({email:login.includes("@")?login:login+"@"+DOMINIO,password:senha});
  b.disabled=false;b.textContent="Entrar";
  if(error){erroTela(/banned/i.test(error.message)?"Usuário desativado. Fale com o RH.":/rate|too many/i.test(error.message)?"Muitas tentativas. Aguarde alguns minutos e tente de novo.":"Usuário ou senha incorretos.");return}
  await iniciarSessao(true);
}
async function iniciarSessao(novoLogin){
  const {data:{user}}=await SB.auth.getUser();
  if(!user){mostrarTela("login");return}
  const {data:p}=await SB.from("perfis").select("*").eq("user_id",user.id).maybeSingle();
  if(!p||!p.ativo){await SB.auth.signOut();mostrarTela("login","Este usuário não tem acesso ativo ao portal. Fale com o RH.");return}
  PERFIL=p;ROLE=p.perfil;SESSION={login:p.login,nome:p.nome,perfil:p.perfil};
  if(novoLogin){SB.rpc("registrar_acesso").then(()=>{},()=>{});logEvento("Login","Acesso ao portal")}
  mostrarTela("carregando");
  try{
    if(ROLE==="rh"){if(!(await carregarRH())){await carregarUsuarios();mostrarTela("inicioRH");return}}
    else await carregarGerente();
  }catch(e){console.error(e);mostrarTela("erro");return}
  mostrarApp();go();ligarTempoReal();
}
async function sair(){
  if(SESSION)logEvento("Logout","Saiu do portal");
  await sleep(300);if(RT){SB.removeChannel(RT);RT=null}await SB.auth.signOut();
  SESSION=null;PERFIL=null;ROLE=null;ST=null;SOLIC=[];MOVS=[];LOGV=null;ORDEM.forEach(t=>delete LAST[t]);
  location.hash="";mostrarTela("login");
}
async function boot(){
  mostrarTela("carregando");
  if(!CONF.supabaseUrl||!CONF.supabaseAnonKey||!window.supabase){mostrarTela("configurar");return}
  SB=window.supabase.createClient(CONF.supabaseUrl,CONF.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true}});
  if(new URLSearchParams(location.search).get("c")){candidatoBoot();return}
  SB.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT"&&SESSION){SESSION=null;mostrarTela("login")}});
  const {data:{session}}=await SB.auth.getSession();
  if(session)await iniciarSessao(false);else mostrarTela("login");
}

async function avisoFeriasPDF(eid,ini){
  const e=emp(eid);const f=e&&e.ferias.find(x=>x.inicio===ini);if(!f)return;
  if(!window.jspdf){toast("O gerador de PDF não carregou. Recarregue a página e tente de novo.");return}
  const ord=e.ferias.slice().sort((a,b)=>a.inicio.localeCompare(b.inicio));const k=ord.indexOf(f);
  const aqIni=f.aquisitivo||addMonths(e.admissao,12*k),aqFim=addDays(addMonths(aqIni,12),-1);
  const fim=addDays(f.inicio,f.dias-1),retorno=addDays(f.inicio,f.dias),pagto=addDays(f.inicio,-2);
  const s=store(e.lojaId);const agora=new Date().toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"});
  const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"});
  const W=210,M=20,verde=[11,127,74],tinta=[16,32,26],cinza=[91,109,100];
  const via=(nomeVia,primeiraPagina)=>{
    if(!primeiraPagina)doc.addPage();
    doc.setFillColor(...verde);doc.rect(0,0,W,30,"F");
    doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(18);doc.text("BRASILEIRÍSSIMA",M,15);
    doc.setFont("helvetica","normal");doc.setFontSize(9);doc.text("Gestão de Pessoas · "+s.nome+(s.cidade?" · "+s.cidade:""),M,22);
    doc.text(nomeVia,W-M,15,{align:"right"});
    doc.setTextColor(...tinta);doc.setFont("helvetica","bold");doc.setFontSize(15);doc.text("AVISO E RECIBO DE PROGRAMAÇÃO DE FÉRIAS",M,46);
    doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(...cinza);doc.text("Comunicação prévia de férias conforme o art. 135 da CLT",M,52);
    const linhas=[["Colaborador(a)",e.nome],["Cargo",e.cargo],["Unidade",s.nome],["Data de admissão",fdate(e.admissao)],["Período aquisitivo",fdate(aqIni)+" a "+fdate(aqFim)],
      ["Período de gozo",fdate(f.inicio)+" a "+fdate(fim)+" ("+f.dias+" dias)"],["Abono pecuniário",f.abono?"Sim, 10 dias convertidos em dinheiro":"Não"],["Retorno ao trabalho",fdate(retorno)],["Pagamento das férias até",fdate(pagto)]];
    let y=62;
    doc.setDrawColor(223,232,227);
    linhas.forEach(([a,b],i)=>{if(i%2===0){doc.setFillColor(242,246,243);doc.rect(M,y-5,W-2*M,8,"F")}

async function processarPDF(file){
  if(!file)return;
  if(!/\.pdf$/i.test(file.name)&&file.type!=="application/pdf"){fiStatus("Escolha um arquivo PDF.",true);return}
  if(file.size>20e6){fiStatus("O PDF tem mais de 20 MB. Envie uma versão menor.",true);return}
  const sample=window.claude&&window.claude.use?await window.claude.use("sample"):null;
  if(!sample){fiStatus("A leitura automática não está disponível nesta visualização. Abra o portal no claude.ai ou no app Claude.",true);return}
  try{
    fiStatus("Abrindo o PDF…");
    const lib=await pdfjs();
    const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise;
    const n=Math.min(pdf.numPages,10);let texto="";
    for(let p=1;p<=n;p++){
      const pg=await pdf.getPage(p);const tc=await pg.getTextContent();let lastY=null,line="";const lines=[];
      tc.items.forEach(it=>{const y=Math.round(it.transform[5]);if(lastY!==null&&Math.abs(y-lastY)>3){lines.push(line);line=""}line+=(line&&it.str&&!line.endsWith(" ")?" ":"")+it.str;lastY=y});
      lines.push(line);texto+="\n--- página "+p+" ---\n"+lines.filter(l=>l.trim()).join("\n");
    }
    let images;
    if(texto.replace(/[\s-]|página \d+/g,"").length<200){
      const lim=await sample.limits().catch(()=>null);
      if(!lim||!lim.images){fiStatus("Este PDF é uma imagem digitalizada e esta visualização não envia imagens ao Claude. Use um PDF com texto selecionável.",true);return}
      fiStatus("PDF digitalizado: preparando as páginas…");images=[];
      for(let p=1;p<=Math.min(pdf.numPages,lim.images.maxCount,4);p++){
        const pg=await pdf.getPage(p);const vp=pg.getViewport({scale:2});const cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;
        await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
        images.push(await new Promise(r=>cv.toBlob(r,"image/jpeg",.85)));
      }
    }
    fiStatus("Identificando os dados da ficha com o Claude… pode levar até um minuto.");
    const out=await sample.json(promptFicha(images?null:texto.slice(0,60000)),{images,modelTier:"default"});
    const dados=normalizarExtraido(out||{});
    const achados=CAMPOS.filter(([k])=>dados[k]!==""&&dados[k]!==null&&dados[k]!==undefined).length;
    if(achados<3){fiStatus("Não encontrei dados de ficha de registro neste PDF. Confira se é o documento certo.",true);return}
    logEvento("Ficha importada do PDF",file.name+" · "+(dados.nome||"sem nome"));
    abrirFichaForm(null,dados,dados.dependentes,file.name);
  }catch(e){
    const c=e&&e.code;
    fiStatus(c==="not_granted"?"Sem permissão para usar o Claude. Permita quando a plataforma perguntar e tente de novo.":c==="rate_limited"?"Muitas leituras seguidas. Aguarde um minuto e tente de novo.":c==="prompt_too_large"?"O PDF tem texto demais. Envie só as páginas da ficha.":c==="invalid_json"||c==="empty_completion"?"Não consegui organizar os dados desta ficha. Tente de novo ou preencha manualmente.":e&&e.name==="PasswordException"?"O PDF está protegido por senha. Remova a senha e envie de novo.":"Não foi possível ler este PDF. Verifique o arquivo e tente de novo.",true);
  }
}

Regras:

function normalizarExtraido(o){

  const dt=v=>{const s=str(v);if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return m?m[3]+"-"+m[2]+"-"+m[1]:""};
  CAMPOS.forEach(([k,,tp])=>{const v=o[k];d[k]=tp==="d"?dt(v):tp==="n"?num(v):tp==="b"?(v===true||v===false?v:null):str(v)});

  return d;
}

  {const al=FX.eid?emp(FX.eid):null;if(al&&al.ficha&&(al.ficha.rateioCC||[]).length>1)delete ficha.centroCusto;else if(ficha.centroCusto)ficha.centroCustoCodigo=(String(ficha.centroCusto).match(/^([\d.]+)/)||[])[1]||""}

const semAcento=s=>String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const OBRIG=["nome","cpf","cargo","lojaId","admissao","salario"];
const EXTRA_ALIAS={nome:["colaborador","funcionario","empregado","nome"],cpf:["cpf do colaborador"],cargo:["funcao"],lojaId:["loja","filial","local de trabalho","unidade"],
  admissao:["admissao","data admissao","dt admissao"],salario:["salario base","remuneracao"],nascimento:["data de nascimento","dt nascimento"],pis:["pis","nis","pis pasep"],
  ctpsNumero:["ctps","carteira de trabalho"],vt:["vale transporte","vt","vale transporte s n","vale transporte sim nao","optante vt"],comissao:["comissao","comissao %"],telefone:["celular","fone"],email:["e mail"],dependentesIR:["dependentes ir","dependentes","qtd dependentes"]};
const COLS_PLAN=[...CAMPOS.map(([k,t])=>({k,t,tp:CAMPOS.find(c=>c[0]===k)[2]})),{k:"dependentesIR",t:"Dependentes para IR (quantidade)",tp:"n"}];
function mapearCabecalhos(heads){
  const mapa={},usados=new Set();
  heads.forEach((h,i)=>{
    const n=semAcento(h);if(!n)return;
    const c=COLS_PLAN.find(c=>!usados.has(c.k)&&(semAcento(c.t)===n||semAcento(c.k)===n||(EXTRA_ALIAS[c.k]||[]).some(a=>semAcento(a)===n)));
    if(c){mapa[i]=c.k;usados.add(c.k)}
  });
  return mapa;
}
function dataReal(s){if(!s)return "";const [y,m,d]=s.split("-").map(Number);const dt=new Date(y,m-1,d);return dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===d&&y>1900&&y<2100?s:""}
function valData(v){return dataReal(valData0(v))}
function valData0(v){
  if(v instanceof Date&&!isNaN(v))return iso(v);
  if(typeof v==="number"&&window.XLSX){const d=XLSX.SSF.parse_date_code(v);if(d)return d.y+"-"+pad(d.m)+"-"+pad(d.d)}
  const s=String(v||"").trim();let m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);if(m)return m[3]+"-"+pad(m[2])+"-"+pad(m[1]);
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[1]+"-"+m[2]+"-"+m[3]:"";
}
function valNum(v){if(typeof v==="number")return isFinite(v)?v:null;const s=String(v||"").replace(/[^\d,.-]/g,"");if(!s)return null;const n=Number(s.includes(",")?s.replace(/\./g,"").replace(",","."):s);return isFinite(n)?n:null}
function achaCargo(v){const fem=s=>s.replace(/(\w{3,})a\b/g,"$1");const n=fem(semAcento(String(v||"").replace(/\(a\)/gi,"")));if(!n)return "";return Object.keys(CARGOS).find(c=>{const x=fem(semAcento(c.replace(/\(a\)/g,"")));return x===n||x.startsWith(n)||n.startsWith(x)})||""}
function achaLoja(v){const n=semAcento(v);if(!n)return "";const sem=s=>semAcento(s).replace(/^brasileirissima /,"");
  return (ST.stores.find(s=>semAcento(s.id)===n||semAcento(s.nome)===n||sem(s.nome)===n.replace(/^brasileirissima /,""))||{}).id||""}
function achaTipo(v,adm){const n=semAcento(v);if(n){const t=TIPOS_CONTRATO.find(t=>semAcento(t).split(" ")[0]===n.split(" ")[0]||n.includes(semAcento(t).split(" ")[0]));if(t)return t}
  return adm&&diffDays(adm,TODAY)<90?"Experiência 45 + 45 dias":"Prazo indeterminado"}
function valBool(v){const n=semAcento(v);return v===true||["s","sim","x","1","true","optante","yes"].includes(n)}

async function lerPlanilha(file){
  if(!file)return;
  if(!window.XLSX){plStatus("O leitor de planilhas não carregou. Recarregue a página.",true);return}
  if(file.size>10e6){plStatus("A planilha tem mais de 10 MB. Divida em arquivos menores.",true);return}
  try{
    plStatus("Lendo a planilha…");
    let wb;
    if(/\.csv$/i.test(file.name)||file.type==="text/csv"){
      const buf=await file.arrayBuffer();let txt;
      try{txt=new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(e){txt=new TextDecoder("windows-1252").decode(buf)}
      const l1=txt.split(/\r?\n/)[0]||"";const fs=(l1.match(/;/g)||[]).length>(l1.match(/,/g)||[]).length?";":(l1.includes("\t")?"\t":",");
      wb=XLSX.read(txt.replace(/^﻿/,""),{type:"string",FS:fs,raw:true});
    } else wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:true,blankrows:false});
    if(aoa.length&&ehPlanilhaDP(aoa[0])){plStatus("Planilha de fichas do DP reconhecida. Organizando os dados…");const dp=converterPlanilhaDP(wb);if(!dp.linhas.length){plStatus("A aba Ativos não tem colaboradores.",true);return}PLAN={origem:file.name,dp,linhas:dp.linhas,ignoradas:[]};previaDP();return}
    const hi=aoa.findIndex(r=>Object.keys(mapearCabecalhos(r)).length>=3);
    if(hi<0){plStatus("Não encontrei os cabeçalhos das colunas. Use o modelo: a primeira linha deve ter Nome completo, CPF, Cargo, Unidade, Data de admissão e Salário.",true);return}
    const mapa=mapearCabecalhos(aoa[hi]);
    const faltam=OBRIG.filter(k=>!Object.values(mapa).includes(k));
    if(faltam.length){plStatus("Faltam colunas obrigatórias: "+faltam.map(k=>COLS_PLAN.find(c=>c.k===k).t).join(", ")+".",true);return}
    const ignoradas=aoa[hi].filter((h,i)=>String(h).trim()&&!(i in mapa));
    const linhas=[];const cpfsVistos=new Map();
    aoa.slice(hi+1).forEach((r,ri)=>{
      if(r.every(c=>String(c).trim()===""))return;
      const bruto={};Object.entries(mapa).forEach(([i,k])=>{bruto[k]=r[i]});
      const v={},erros=[],avisos=[];
      COLS_PLAN.forEach(({k,tp})=>{
        if(!(k in bruto))return;const x=bruto[k];if(String(x).trim()==="")return;
        if(k==="cargo"){v.cargo=achaCargo(x);if(!v.cargo)erros.push("Cargo não reconhecido: "+x)}
        else if(k==="lojaId"){v.lojaId=achaLoja(x);if(!v.lojaId)erros.push("Unidade não encontrada: "+x)}
        else if(k==="tipoContrato")v.tipoContrato=String(x).trim();
        else if(tp==="d"){v[k]=valData(x);if(!v[k])erros.push("Data inválida em "+COLS_PLAN.find(c=>c.k===k).t+": "+x)}
        else if(tp==="n"){v[k]=valNum(x);if(v[k]===null)erros.push("Número inválido em "+COLS_PLAN.find(c=>c.k===k).t+": "+x)}
        else if(tp==="b")v[k]=valBool(x);
        else v[k]=String(x).trim().slice(0,300);
      });
      v.tipoContrato=achaTipo(v.tipoContrato,v.admissao);
      if(!v.nome)erros.push("Nome em branco");
      if(!v.admissao&&!erros.some(x=>x.includes("admissão")))erros.push("Data de admissão em branco");
      if(v.salario==null&&!erros.some(x=>x.includes("Salário")))erros.push("Salário em branco");
      else if(v.salario!=null&&v.salario<ST.cfg.salarioMinimo)erros.push("Salário abaixo do mínimo ("+brl(ST.cfg.salarioMinimo)+")");
      if(v.vt===undefined)v.vt=true;
      const dig=soDig(v.cpf);let alvo=null;
      if(!dig)erros.push("CPF em branco");
      else if(!cpfValido(dig))erros.push("CPF inválido: "+v.cpf);
      else{
        v.cpf=fmtCPF(dig);
        if(cpfsVistos.has(dig))erros.push("CPF repetido na linha "+cpfsVistos.get(dig));else cpfsVistos.set(dig,ri+hi+2);
        const ex=ST.emps.find(e=>soDig(e.cpf)===dig&&!e.desligado);if(ex){alvo=ex.id;avisos.push("Atualiza o cadastro de "+ex.nome)}
      }
      linhas.push({n:ri+hi+2,v,erros,avisos,alvo});
    });
    if(!linhas.length){plStatus("A planilha não tem linhas de colaboradores abaixo dos cabeçalhos.",true);return}
    PLAN={origem:file.name,linhas,ignoradas};
    previaPlanilha();
  }catch(e){console.error(e);plStatus("Não foi possível ler este arquivo. Salve como .xlsx ou .csv e tente de novo.",true)}
}

    ${PLAN.linhas.length>300?`<p class="small muted">Mostrando 300 de ${PLAN.linhas.length} linhas, com as de erro primeiro.</p>`:""}`,
    `<button class="btn" data-act="importarPlanilhaOutra">Escolher outro arquivo</button><button class="btn btn-primary" data-act="confirmarPlanilha" ${ok.length?"":"disabled"}>Importar ${ok.length} colaborador${ok.length===1?"":"es"}</button>`);
}
function confirmarPlanilha(){
  if(PLAN&&PLAN.dp){const r=aplicarImportacaoDP(PLAN.dp,PLAN.origem);logEvento("Fichas do DP importadas",PLAN.origem+" · "+r.novos+" novos, "+r.upd+" atualizados, "+r.novasU+" unidades novas");PLAN=null;closeModal();commit(r.novos+" colaboradores incluídos, "+r.upd+" atualizados e "+r.novasU+" unidades criadas");return}
  const ok=PLAN.linhas.filter(l=>!l.erros.length);let novos=0,upd=0;
  ok.forEach(l=>{
    const v={...l.v};const nDep=v.dependentesIR;delete v.dependentesIR;
    const ex=l.alvo?emp(l.alvo):null;
    const deps=(ex&&ex.ficha&&ex.ficha.dependentesLista)||[];
    const r=gravarColab(v,deps,l.alvo,PLAN.origem);

function pdfTabela({titulo,filtros,resumo,colunas,linhas,larguras,arquivo,log,depois,fonte}){
  if(!window.jspdf||!window.jspdf.jsPDF){toast("O gerador de PDF não carregou. Recarregue a página e tente de novo.");return}
  const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4",orientation:"landscape"});
  if(typeof doc.autoTable!=="function"){toast("O gerador de tabelas do PDF não carregou. Recarregue a página e tente de novo.");return}
  const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(),M=12;
  const verde=[11,127,74],tinta=[16,32,26],cinza=[91,109,100];
  const emitido=new Date().toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})+(SESSION&&SESSION.nome?" por "+SESSION.nome:"");
  const topo=()=>{
    doc.setFillColor(...verde);doc.rect(0,0,W,16,"F");
    doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(11);doc.text("BRASILEIRÍSSIMA · Gestão de Pessoas",M,10.5);
    doc.setFont("helvetica","normal");doc.setFontSize(9);doc.text(titulo,W-M,10.5,{align:"right"});
  };
  topo();
  doc.setTextColor(...tinta);doc.setFont("helvetica","bold");doc.setFontSize(16);doc.text(titulo,M,27);
  doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(...cinza);
  doc.text(doc.splitTextToSize(filtros,W-2*M),M,33);
  let y=39;
  if(resumo&&resumo.length){
    let x=M;doc.setFontSize(8.5);
    resumo.forEach(([rot,val])=>{const t=rot+": "+val;const w=doc.getTextWidth(t)+8;if(x+w>W-M){x=M;y+=8}
      doc.setFillColor(242,246,243);doc.roundedRect(x,y-4.5,w,6.5,2,2,"F");doc.setTextColor(...tinta);doc.text(t,x+4,y);x+=w+4});
    y+=7;
  }
  const cs={};(larguras||[]).forEach((w,i)=>{if(w)cs[i]={cellWidth:w}});
  doc.autoTable({head:[colunas],body:linhas.length?linhas:[[{content:"Nenhum registro com os filtros escolhidos.",colSpan:colunas.length,styles:{halign:"center",textColor:cinza}}]],startY:y,
    margin:{left:M,right:M,top:22,bottom:14},theme:"grid",columnStyles:cs,
    styles:{font:"helvetica",fontSize:fonte||8,cellPadding:fonte&&fonte<8?1.3:1.8,textColor:tinta,lineColor:[223,232,227],lineWidth:.2,valign:"middle",overflow:"linebreak"},
    headStyles:{fillColor:verde,textColor:255,fontStyle:"bold",fontSize:fonte||8},alternateRowStyles:{fillColor:[247,250,248]},
    didDrawPage:d=>{if(d.pageNumber>1)topo();doc.setFontSize(7.5);doc.setTextColor(...cinza);doc.text("Emitido em "+emitido+" · Documento interno do RH",M,H-6);doc.text("Página "+d.pageNumber,W-M,H-6,{align:"right"})}});
  if(depois)depois(doc,doc.lastAutoTable.finalY);
  salvarPDF(doc,arquivo).then(ok=>{if(ok&&log)logEvento(log[0],log[1])});
}

/* ============ desligamento programado (aprovação da diretoria) ============ */
const ST_DP={aguardando:{t:"Aguardando diretoria",c:"c-warn"},aprovado:{t:"Aprovado pela diretoria",c:"c-ok"},reprovado:{t:"Reprovado",c:"c-bad"},efetivado:{t:"Efetivado",c:"c-mute"},cancelado:{t:"Cancelado",c:"c-mute"}};
const AVISO_T={indenizado:"Indenizado",trabalhado:"Trabalhado"};
function calcProgramado(e,data,tipo,aviso){
  const r=rescisao(e,data,tipo,aviso);
  const baseFgts=r.linhas.slice(0,3).reduce((t,l)=>t+l[1],0);
  const fgtsMes=r2(baseFgts*ST.cfg.fgts/100);
  return {linhas:r.linhas,total:r.total,multa:r.multa,saldoFgts:r.saldoFgts,saque:r.saque,diasAviso:r.diasAviso,anos:r.anos,fgtsMes,custo:r2(r.total+r.multa+fgtsMes),calculadoEm:TODAY,salario:e.salario};
}
const dpAtivo=eid=>(ST.desligProg||[]).find(p=>p.eid===eid&&(p.status==="aguardando"||p.status==="aprovado"));
function dpHist(p,acao,por,obs,detalhe){p.historico=p.historico||[];p.historico.push({em:new Date().toISOString(),acao,por:por||"",obs:obs||"",detalhe:detalhe||""})}
function programarDeslig(){
  const e=emp($("#rs-emp").value);if(!e){toast("Escolha um colaborador na lista.");return}
  const data=$("#rs-data").value,tipo=$("#rs-tipo").value,aviso=$("#rs-aviso").value,just=$("#rs-motivo").value.trim();
  const err=m=>{const el=$("#rs-err");el.hidden=false;el.textContent=m};
  if(!data)return err("Informe a data prevista do desligamento.");
  if(just.length<10)return err("Escreva a justificativa para a diretoria (pelo menos uma frase).");
  if(dpAtivo(e.id))return err(e.nome+" já tem um desligamento programado em andamento. Use \"Alterar programação\" no quadro de desligamentos programados.");
  const p={id:uid(),eid:e.id,nome:e.nome,cargo:e.cargo,lojaId:e.lojaId,data,tipo,aviso,justificativa:just.slice(0,1500),calc:calcProgramado(e,data,tipo,aviso),status:"aguardando",criadoEm:TODAY,criadoPor:SESSION?SESSION.nome:"",historico:[]};
  dpHist(p,"Programado",p.criadoPor,"",TIPOS[tipo]+" em "+fdate(data)+" · aviso "+(AVISO_T[aviso]||"").toLowerCase()+" · custo estimado "+brl(p.calc.custo));
  ST.desligProg=[...(ST.desligProg||[]),p];
  logEvento("Desligamento programado",e.nome+" · "+TIPOS[tipo]+" em "+fdate(data)+" · custo estimado "+brl(p.calc.custo));
  closeModal();commit("Desligamento programado e aguardando a diretoria");

      <div class="field"><label for="da-aviso">Aviso prévio</label><select class="input" id="da-aviso"><option value="indenizado" ${p.aviso==="indenizado"?"selected":""}>Indenizado</option><option value="trabalhado" ${p.aviso==="trabalhado"?"selected":""}>Trabalhado</option></select></div>
      <div class="field full"><label for="da-just">Justificativa para a diretoria</label><textarea class="input" id="da-just" rows="3">${esc(p.justificativa)}</textarea></div>
      <div class="field full"><label for="da-motivo">O que mudou e por quê</label><textarea class="input" id="da-motivo" rows="2" placeholder="Ex.: data adiada para depois do fechamento do mês, conforme pedido da diretoria"></textarea></div>
      <p class="full small" id="da-err" style="color:var(--bad)" hidden></p>
    </form><div id="da-calc"></div>`,
    `<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" data-act="dpSalvarAlteracao">${p.status==="aguardando"?"Salvar alteração":"Salvar e reenviar à diretoria"}</button>`);
  dpAlterarCalc();
}
function dpAlterarCalc(){
  const p=(ST.desligProg||[]).find(x=>x.id===DPA);const e=p&&emp(p.eid);const box=$("#da-calc");if(!p||!e||!box)return;
  const data=$("#da-data").value;if(!data){box.innerHTML="";return}
  const n=calcProgramado(e,data,$("#da-tipo").value,$("#da-aviso").value);const dif=r2(n.custo-p.calc.custo);
  box.innerHTML=`<div class="kv"><div><span>Custo anterior</span><b class="num">${brl(p.calc.custo)}</b></div><div><span>Novo custo estimado</span><b class="num">${brl(n.custo)}</b></div><div><span>Diferença</span><b class="num" style="color:${dif>0?"var(--bad)":dif<0?"var(--ok)":"inherit"}">${dif>0?"+":""}${brl(dif)}</b></div><div><span>Verbas · FGTS</span><b class="num">${brl(n.total)} · ${brl(n.multa+n.fgtsMes)}</b></div></div>`;
}
function dpSalvarAlteracao(){
  const p=(ST.desligProg||[]).find(x=>x.id===DPA);const e=p&&emp(p.eid);if(!p||!e)return;
  const err=m=>{const el=$("#da-err");el.hidden=false;el.textContent=m};
  const tipo=$("#da-tipo").value,data=$("#da-data").value,aviso=$("#da-aviso").value,just=$("#da-just").value.trim(),motivo=$("#da-motivo").value.trim();
  if(!data)return err("Informe a data prevista.");
  if(just.length<10)return err("A justificativa para a diretoria precisa ter pelo menos uma frase.");
  if(motivo.length<5)return err("Explique o que mudou e por quê. Isso fica no histórico e no PDF.");
  const mud=[];
  if(tipo!==p.tipo)mud.push("tipo: "+TIPOS[p.tipo]+" → "+TIPOS[tipo]);
  if(data!==p.data)mud.push("data: "+fdate(p.data)+" → "+fdate(data));
  if(aviso!==p.aviso)mud.push("aviso: "+(AVISO_T[p.aviso]||"").toLowerCase()+" → "+(AVISO_T[aviso]||"").toLowerCase());
  if(just!==p.justificativa)mud.push("justificativa revisada");
  const novo=calcProgramado(e,data,tipo,aviso);
  if(novo.custo!==p.calc.custo)mud.push("custo: "+brl(p.calc.custo)+" → "+brl(novo.custo));
  const voltou=p.status!=="aguardando";
  dpHist(p,"Alterado",SESSION?SESSION.nome:"",motivo,(mud.join(" · ")||"sem mudança nos valores")+(voltou?" · reenviado à diretoria (estava "+ST_DP[p.status].t.toLowerCase()+")":""));
  Object.assign(p,{tipo,data,aviso,justificativa:just.slice(0,1500),calc:novo});
  if(voltou){p.decisaoAnterior=p.decisao;p.decisao=null;p.status="aguardando"}
  logEvento("Desligamento programado alterado",p.nome+" · "+(mud.join(" · ")||"sem mudança")+" · "+motivo);
  DPA=null;closeModal();commit(voltou?"Programação alterada e reenviada à diretoria":"Programação alterada");dpDetalhe(p.id);
}

function dpRegistrar(id,status){

  FICHA.forEach(sec=>sec.c.forEach(([k,t,tp])=>{
    if(["nome","cpf","cargo","lojaId","admissao","salario","comissao","vt"].includes(k))return;
    add(sec.s,"f_"+k,t,e=>f(e)[k],tp==="d"?"d":tp==="n"?"n":tp==="b"?"b":"t");

  add("Situação e controles","feriasProx","Próximas férias",e=>{const p=(e.ferias||[]).find(x=>x.inicio>TODAY&&!x.perda);return p?fdate(p.inicio)+" a "+fdate(addDays(p.inicio,p.dias-1)):""});

function pjParseBen(t){return String(t||"").split(/;\s*/).map(s=>s.trim()).filter(Boolean).map(s=>{const m=s.match(/^(.*?)[:=]\s*(.+)$/);return m?{tipo:m[1].trim(),valor:valNum(m[2]),obs:""}:{tipo:s,valor:"",obs:""}}).filter(b=>b.tipo)}
function pjParseFx(t){return String(t||"").split(/;\s*/).map(s=>s.trim()).filter(Boolean).map(s=>{const m=s.match(/^([\d.,]+)\s*(?:-|a|até)\s*([\d.,]*)\s*[:=]\s*([\d.,]+)/i);return m?{de:valNum(m[1]),ate:m[2]?valNum(m[2]):"",perc:valNum(m[3])}:null}).filter(Boolean)}
async function pjLerPlanilha(file){
  const st=(m,e)=>{const el=$("#pj-status");if(el){el.textContent=m;el.style.color=e?"var(--bad)":""}};
  if(!file)return;if(!window.XLSX){st("O leitor de planilhas não carregou. Recarregue a página.",true);return}
  try{
    st("Lendo a planilha…");let wb;
    if(/\.csv$/i.test(file.name)){const buf=await file.arrayBuffer();let txt;try{txt=new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(e){txt=new TextDecoder("windows-1252").decode(buf)}const l1=txt.split(/\r?\n/)[0]||"";wb=XLSX.read(txt.replace(/^﻿/,""),{type:"string",FS:(l1.match(/;/g)||[]).length>(l1.match(/,/g)||[]).length?";":",",raw:true})}
    else wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:"",raw:true,blankrows:false});
    const hi=aoa.findIndex(r=>Object.keys(pjMapear(r)).length>=3);
    if(hi<0){st("Não encontrei os cabeçalhos. Use o modelo: a primeira linha deve ter Razão social, CNPJ e Início da vigência.",true);return}
    const mapa=pjMapear(aoa[hi]);const faltam=["razaoSocial","cnpj","inicio"].filter(k=>!Object.values(mapa).includes(k));
    if(faltam.length){st("Faltam colunas obrigatórias: "+faltam.map(k=>PJ_COLS.find(c=>c.k===k).t).join(", ")+".",true);return}
    const linhas=[];const vistos=new Set();
    aoa.slice(hi+1).forEach((r,ri)=>{
      if(r.every(c=>String(c).trim()===""))return;
      const v={},erros=[];
      Object.entries(mapa).forEach(([i,k])=>{const c=PJ_COLS.find(x=>x.k===k);const x=r[i];if(String(x).trim()==="")return;
        if(k==="lojaId"){v.lojaId=achaLoja(x);if(!v.lojaId)erros.push("Unidade não encontrada: "+x)}
        else if(c.tp==="d"){v[k]=valData(x);if(!v[k])erros.push("Data inválida em "+c.t+": "+x)}
        else if(c.tp==="n"){v[k]=valNum(x);if(v[k]===null)erros.push("Número inválido em "+c.t+": "+x)}
        else if(c.tp==="b")v[k]=valBool(x);
        else if(String(c.tp).startsWith("sel:")){const ops=c.tp.slice(4).split("|");v[k]=ops.find(o=>semAcento(o)===semAcento(x))||ops.find(o=>semAcento(o).startsWith(semAcento(x)))||"";if(!v[k])erros.push(c.t+" não reconhecido: "+x)}
        else v[k]=String(x).trim().slice(0,500)});
      v.beneficios=pjParseBen(v.beneficiosTxt);v.faixas=pjParseFx(v.faixasTxt);delete v.beneficiosTxt;delete v.faixasTxt;
      v.modalidade=v.modalidade||"Mensal fixo";v.comTipo=v.comTipo||"Sem comissão";
      if(!v.razaoSocial)erros.push("Razão social em branco");
      if(!cnpjValido(v.cnpj))erros.push("CNPJ inválido: "+(v.cnpj||"em branco"));else{v.cnpj=fmtCNPJ(v.cnpj);if(vistos.has(soDig(v.cnpj)))erros.push("CNPJ repetido na planilha");vistos.add(soDig(v.cnpj))}
      if(!v.inicio&&!erros.some(e=>e.includes("Início")))erros.push("Início da vigência em branco");
      if(v.modalidade==="Por hora"?!(v.valorHora>0):!(v.valorMensal>0))erros.push("Valor do contrato em branco");
      const ex=v.cnpj&&(ST.pjs||[]).find(p=>!p.encerrado&&soDig(p.cnpj)===soDig(v.cnpj));
      linhas.push({n:ri+hi+2,v,erros,alvo:ex?ex.id:null});
    });
    if(!linhas.length){st("A planilha não tem contratos abaixo dos cabeçalhos.",true);return}
    PJIMP={origem:file.name,linhas};pjPrevia();
  }catch(e){console.error(e);st("Não foi possível ler este arquivo. Salve como .xlsx ou .csv e tente de novo.",true)}
}

function pjExpDados(){
  const ks=[...document.querySelectorAll('input[name="pjexp-c"]:checked')].map(i=>i.value);if(!ks.length){toast("Escolha pelo menos um campo.");return null}
  try{localStorage.setItem(PJ_EXP_KEY,JSON.stringify(ks))}catch(e){}
  const C=pjCamposExport().filter(c=>ks.includes(c.k));const e=UI.pjExpEsc||"tela";
  const ps=(e==="ativos"?(ST.pjs||[]).filter(p=>!p.encerrado):e==="todos"?(ST.pjs||[]).slice():pjLista());
