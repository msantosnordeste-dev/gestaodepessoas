/* ============ medidas disciplinares (prontuário) ============ */
const MD_TIPOS={
  orientacao:{t:"Orientação registrada",c:"c-info",ic:"OR",doc:"REGISTRO DE ORIENTAÇÃO DISCIPLINAR",peso:0},
  adv_verbal:{t:"Advertência verbal",c:"c-warn",ic:"AV",doc:"REGISTRO DE ADVERTÊNCIA VERBAL",peso:1},
  adv_escrita:{t:"Advertência escrita",c:"c-warn",ic:"AE",doc:"ADVERTÊNCIA DISCIPLINAR",peso:2},
  suspensao:{t:"Suspensão",c:"c-bad",ic:"SU",doc:"COMUNICADO DE SUSPENSÃO DISCIPLINAR",peso:3},
  justa:{t:"Justa causa",c:"c-bad",ic:"JC",doc:"REGISTRO DE APLICAÇÃO DE JUSTA CAUSA",peso:4}
};
const MD_MOTIVOS=["Atrasos ou faltas injustificadas","Desídia (negligência no trabalho)","Indisciplina (descumprir normas da empresa)","Insubordinação (descumprir ordem direta)","Mau procedimento ou conduta inadequada","Divergência ou falta de caixa","Uso inadequado de uniforme ou EPI","Atendimento inadequado ao cliente","Uso de celular em horário de trabalho","Abandono do posto de trabalho","Ofensa ou agressão a colega ou cliente","Descumprimento de procedimento de prevenção de perdas","Outros"];
const MD_CIENCIA={pendente:{t:"Ciência pendente",c:"c-warn"},assinado:{t:"Assinado",c:"c-ok"},recusou:{t:"Recusou assinar (testemunhas)",c:"c-info"}};
const mdValidas=e=>(e.medidas||[]).filter(m=>!m.anulada);
const mdTodas=()=>ST.emps.flatMap(e=>(e.medidas||[]).map(m=>({e,m})));
const md12=e=>mdValidas(e).filter(m=>m.data>=addDays(TODAY,-364));
function mdSugestao(e){
  const l=md12(e);if(!l.length)return {t:"Sem medidas nos últimos 12 meses.",c:"c-ok"};
  const max=Math.max(...l.map(m=>MD_TIPOS[m.tipo].peso));const ult=l.slice().sort((a,b)=>b.data.localeCompare(a.data)||(b.registradoEm||"").localeCompare(a.registradoEm||""))[0];
  const prox=max>=3?"nova falta grave pode justificar a justa causa (avalie com o jurídico)":max>=2?"a próxima medida tende a ser suspensão":max>=1?"a próxima medida tende a ser advertência escrita":"a próxima medida tende a ser advertência verbal";
  return {t:l.length+" medida"+(l.length===1?"":"s")+" válida"+(l.length===1?"":"s")+" em 12 meses · última: "+MD_TIPOS[ult.tipo].t.toLowerCase()+" em "+fdate(ult.data)+" · "+prox+".",c:max>=3?"c-bad":max>=1?"c-warn":"c-info"};
}
function mdDescTipo(m){return MD_TIPOS[m.tipo].t+(m.tipo==="suspensao"&&m.dias?" de "+m.dias+" dia"+(m.dias===1?"":"s"):"")}
function mdLista(){
  const per=UI.mPer||"12m",ini=addDays(TODAY,-364);

  if(UI.mTipo)l=l.filter(x=>UI.mTipo==="anuladas"?x.m.anulada:UI.mTipo==="pendentes"?(!x.m.anulada&&x.m.ciencia==="pendente"&&x.m.tipo!=="orientacao"):x.m.tipo===UI.mTipo);
  if(UI.mBusca){const n=semAcento(UI.mBusca),d=soDig(UI.mBusca);l=l.filter(({e,m})=>semAcento([e.nome,e.cargo,store(e.lojaId).nome,m.motivo,m.fato].join(" ")).includes(n)||(d.length>=3&&soDig(e.cpf).includes(d)))}
  return l.sort((a,b)=>b.m.data.localeCompare(a.m.data)||(b.m.registradoEm||"").localeCompare(a.m.registradoEm||""));

/* ---- registrar medida ---- */
let MD_OPTS=[];
const mdOpcao=(e,sel)=>`<option value="${e.id}" ${e.id===sel?"selected":""}>${esc(e.nome)} · ${esc(e.cargo)} · ${esc(store(e.lojaId).nome)}</option>`;
function mdFiltrarEmp(q){
  const n=semAcento(q),d=soDig(q);const s=$("#md-emp");const atual=s.value;
  const l=MD_OPTS.filter(e=>!n||semAcento([e.nome,e.cargo,store(e.lojaId).nome].join(" ")).includes(n)||(d.length>=3&&soDig(e.cpf).includes(d)));
  const sel=l.some(e=>e.id===atual)?atual:l[0]?.id;
  s.innerHTML=l.map(e=>mdOpcao(e,sel)).join("")||`<option value="">Ninguém encontrado</option>`;
  $("#md-cont").textContent=l.length===MD_OPTS.length?MD_OPTS.length+" colaboradores ativos":l.length+" de "+MD_OPTS.length+" colaboradores";
  if(sel!==atual)mdHistHint();
}
function mdHistHint(){const el=$("#md-hist");if(!el)return;const e=emp($("#md-emp").value);if(!e){el.innerHTML="";return}const s=mdSugestao(e);el.innerHTML=`<div class="note"><span class="chip ${s.c}">Histórico</span> ${esc(s.t)}</div>`}
function mdTipoToggle(){const t=$("#md-tipo").value;const b=$("#md-susp");if(b)b.hidden=t!=="suspensao";const j=$("#md-justa");if(j)j.hidden=t!=="justa"}

    <div class="field full"><label for="md-norma">Norma ou orientação descumprida (opcional)</label><input class="input" id="md-norma" placeholder="Ex.: Regulamento interno item 4.2 · horário de entrada às 10h"></div>

function mdSalvar(){
  const v=k=>{const el=$("#md-"+k);return el?String(el.value||"").trim():""};
  const err=m=>{const el=$("#md-err");el.hidden=false;el.textContent=m};
  const e=emp(v("emp"));if(!e)return err("Escolha o colaborador.");
  const tipo=v("tipo"),data=v("data"),dataFato=v("datafato"),fato=v("fato");
  if(!data||!dataFato)return err("Informe a data do fato e a data de aplicação.");
  if(dataFato>data)return err("A data do fato não pode ser depois da aplicação da medida.");
  if(data>addDays(TODAY,30))return err("A data de aplicação está muito no futuro. Confira.");
  if(fato.length<15)return err("Descreva o fato com mais detalhes (pelo menos 15 caracteres).");
  const m={id:uid(),tipo,motivo:v("motivo"),data,dataFato,fato:fato.slice(0,2000),norma:v("norma").slice(0,300),solicitante:v("solic").slice(0,120),obs:v("obs").slice(0,500),
    testemunhas:[v("test1"),v("test2")].filter(Boolean),ciencia:tipo==="orientacao"?"nao_exige":"pendente",registradoPor:SESSION?SESSION.nome:"",registradoEm:new Date().toISOString()};
  if(tipo==="suspensao"){const dias=Math.round(Number(v("dias")));if(!(dias>=1&&dias<=30))return err("A suspensão deve ter de 1 a 30 dias.");const ini=v("inisusp");if(!ini)return err("Informe o início da suspensão.");m.dias=dias;m.inicioSusp=ini;m.fimSusp=addDays(ini,dias-1)}
  e.medidas=[...(e.medidas||[]),m];
  logEvento("Medida disciplinar registrada",e.nome+" · "+mdDescTipo(m)+" · "+m.motivo);
  closeModal();commit(MD_TIPOS[tipo].t+" registrada");
  if(diffDays(dataFato,data)>30)toast("Atenção: mais de 30 dias entre o fato e a medida pode enfraquecer a punição (imediatidade).");
  mdVer(e.id,m.id);
}
/* ---- detalhe, ciência, anulação ---- */

function backupTexto(){const {usuarios,contasDesvinculadas,...o}=ST;return JSON.stringify({formato:"gestao-de-pessoas-backup",versao:1,geradoEm:new Date().toISOString(),por:SESSION?SESSION.nome:"",...o})}

/* importa o arquivo baixado no portal do Claude (ou um backup desta versão) e grava tudo no Supabase */
async function importarBackupArquivo(file){
  if(!file)return;if(ROLE!=="rh"){toast("Só o RH pode importar backup.");return}
  let o;try{o=JSON.parse(await file.text())}catch(e){toast("Arquivo inválido. Use o backup .json baixado no portal.");return}
  if(!o||!Array.isArray(o.emps)||!Array.isArray(o.stores)){toast("Este arquivo não é um backup do Gestão de Pessoas.");return}
  if(ST&&ST.emps.length&&!confirm("Substituir TODOS os dados atuais pelos do backup ("+o.emps.length+" colaboradores, "+o.stores.length+" unidades)? Registros que não estiverem no backup serão apagados."))return;
  delete o.usuarios;delete o.contasDesvinculadas;delete o.formato;delete o.versao;delete o.geradoEm;delete o.por;
  if(o.escala&&!o.escalaOverrides){const m={};o.escala.forEach(x=>{m[x.k]=x.d});o.escalaOverrides=m;delete o.escala}
  const ids=new Set(o.stores.map(s=>s.id));
  const falta=id=>{if(id&&!ids.has(id)){ids.add(id);o.stores.push({id,nome:"Unidade "+id,cidade:"",tipo:"Loja de rua",quadro:0})}};
  o.emps.forEach(e=>falta(e.lojaId));(o.admissoes||[]).forEach(a=>falta(a.lojaId));Object.keys(o.escalaOverrides||{}).forEach(k=>falta(k.split("|")[0]));
  o.cfg=o.cfg||clone(DEFAULT_CFG);o.exemplo=false;
  ST=normalize(o);resumoBase();
  const gated=$(".app").classList.contains("gated");if(gated)mostrarApp();
  persist();go();
  logEvento("Backup importado",file.name+" · "+ST.emps.length+" colaboradores · "+ST.stores.length+" unidades · "+(ST.pjs||[]).length+" PJ");
  toast("Importando "+ST.emps.length+" colaboradores. Aguarde \"Tudo salvo\" no topo antes de fechar a página.");
}

function folhaSugerir(nome,tipo){
  const n=semAcento(nome);
  if(tipo==="D"){if(/falta|atraso|dsr descontado/.test(n))return {nat:"fixo",rub:"salario"};return {nat:"ignorar",rub:""}}
  if(/inss.*(empresa|patronal)|cpp|cota patronal/.test(n))return {nat:"encargo",rub:"inss"};
  if(/\brat\b|\bsat\b|fap|risco ambiental/.test(n))return {nat:"encargo",rub:"rat"};
  if(/terceiro|outras entidades|sistema s|salario educacao|sesc|senac|sebrae|incra/.test(n))return {nat:"encargo",rub:"terceiros"};
  if(/fgts/.test(n))return /multa|rescis/.test(n)?{nat:"provisao",rub:"prov_resc"}:{nat:"encargo",rub:"fgts"};
  if(/provis|prov\./.test(n))return /13|decimo/.test(n)?{nat:"provisao",rub:"prov_13"}:/feria/.test(n)?{nat:"provisao",rub:"prov_ferias"}:/encargo/.test(n)?{nat:"provisao",rub:"enc_prov"}:{nat:"provisao",rub:"prov_resc"};
  if(/aviso|indeniza|rescis|multa/.test(n))return {nat:"provisao",rub:"prov_resc"};
  if(/13|decimo terceiro/.test(n))return {nat:"provisao",rub:"prov_13"};
  if(/feria/.test(n))return {nat:"provisao",rub:"prov_ferias"};
  if(/comiss|dsr s\/? ?com|dsr sobre com/.test(n))return {nat:"variavel",rub:"comissao"};
  if(/premio|bonus|bonifica|gratifica.*meta|ppr|plr/.test(n))return {nat:"variavel",rub:"premio"};
  if(/hora.? extra|h\.?e\.|horas extras/.test(n))return {nat:"variavel",rub:"comissao"};
  if(/noturno/.test(n))return {nat:"fixo",rub:"adic_noturno"};
  if(/vale.?transporte|\bvt\b|vale.?refei|\bvr\b|vale.?alim|\bva\b|plano|saude|odonto|seguro|cesta|refeicao|alimentacao|bem.?estar/.test(n))return {nat:"beneficio",rub:"beneficios"};
  if(tipo==="E")return {nat:"encargo",rub:"inss"};
  if(tipo==="B")return {nat:"beneficio",rub:"beneficios"};
  if(tipo==="V")return {nat:"provisao",rub:"prov_13"};
  return {nat:"fixo",rub:"salario"};
}

function folhaMapear(heads){const m={};const usados=new Set();heads.forEach((h,i)=>{const n=semAcento(h).replace(/[()]/g,"").replace(/\s+/g," ").trim();if(!n)return;

function folhaProcessar(aoa,origem,ficticia){
  const hi=aoa.findIndex(r=>Object.keys(folhaMapear(r)).length>=4);if(hi<0)return {erro:"Não encontrei os cabeçalhos. Use o modelo (Competência, CPF ou Matrícula, Código e descrição do evento, Tipo, Valor)."};

  if(!tem("valor")||!(tem("codigo")||tem("evento")))return {erro:"Faltam as colunas de valor e de evento."};
  const porCpf=new Map(),porMat=new Map(),porNome=new Map();ST.emps.forEach(e=>{const c=soDig(e.cpf||(e.ficha&&e.ficha.cpf));if(c.length===11)porCpf.set(c,e);const m=e.ficha&&e.ficha.matricula;if(m)porMat.set(String(m).trim(),e);porNome.set(semAcento(e.nome),e)});

/* ============ rateio do custo entre centros de custo (colaboradores e prestadores PJ) ============
   Colaborador: e.ficha.rateioCC = [{cc, pct}] · PJ: p.rateioCC = [{cc, pct}] (soma 100%).
   Sem rateio = 100% no centro de custo da ficha (ou do PJ), ou no da unidade. Usado por todos os processos de custo. */
const ccNorm=s=>String(s||"").replace(/\s+/g," ").trim();
const CC_SEM="(sem centro de custo)";
function ccLista(){const s=new Set();ST.stores.forEach(x=>{if(x.centroCusto)s.add(ccNorm(x.centroCusto))});ST.emps.forEach(e=>{const f=e.ficha||{};if(f.centroCusto)s.add(ccNorm(f.centroCusto));(f.rateioCC||[]).forEach(r=>r.cc&&s.add(ccNorm(r.cc)))});(ST.pjs||[]).forEach(p=>{if(p.centroCusto)s.add(ccNorm(p.centroCusto));(p.rateioCC||[]).forEach(r=>r.cc&&s.add(ccNorm(r.cc)))});return [...s].sort((a,b)=>(parseInt(a)||999)-(parseInt(b)||999)||a.localeCompare(b))}
const rtAlvo=(tipo,id)=>tipo==="pj"?(ST.pjs||[]).find(x=>x.id===id):emp(id);
const rtDados=(tipo,o)=>tipo==="pj"?o:(o.ficha=o.ficha||{});
function rateioDe(o,tipo){
  tipo=tipo||(o&&o.razaoSocial!==undefined&&o.ficha===undefined?"pj":"emp");if(!o)return [];
  const f=tipo==="pj"?o:(o.ficha||{});const r=(f.rateioCC||[]).filter(x=>x.cc&&Number(x.pct)>0);
  if(r.length)return r.map(x=>({cc:ccNorm(x.cc),pct:Number(x.pct)}));
  const base=f.centroCusto||(o.lojaId?store(o.lojaId).centroCusto:"")||"";return base?[{cc:ccNorm(base),pct:100}]:[];
}
const rateioTexto=(o,tipo)=>rateioDe(o,tipo).map(x=>x.cc+" "+x.pct.toLocaleString("pt-BR",{maximumFractionDigits:2})+"%").join(" · ");
/* divide valores pelo rateio: devolve [{cc, valores}] */
function ratear(o,valores,tipo){const r=rateioDe(o,tipo);const parts=r.length?r:[{cc:CC_SEM,pct:100}];return parts.map(x=>{const v={};Object.entries(valores).forEach(([k,n])=>{v[k]=(Number(n)||0)*x.pct/100});return {cc:x.cc,pct:x.pct,valores:v}})}
/* acumula uma lista de {o, tipo, valores} por centro de custo */
function porCC(itens){const m={};itens.forEach(it=>ratear(it.o,it.valores,it.tipo).forEach(p=>{const L=m[p.cc]=m[p.cc]||{pessoas:0,v:{}};L.pessoas+=p.pct/100;Object.entries(p.valores).forEach(([k,n])=>{L.v[k]=(L.v[k]||0)+n})}));return m}
/* card com a tabela por centro de custo e exportação em Excel */

  const tot=k=>ks.reduce((t,c)=>t+(m[c].v[k]||0),0);
  return `<div class="card"><div class="card-head"><div><h2>${esc(titulo)}</h2><p>${nota||"Valores divididos pelo rateio de centro de custo de cada pessoa (ficha do colaborador ou do PJ)."}</p></div><button class="btn btn-sm" data-ccxls="${id}">Exportar Excel</button></div>

  <tfoot><tr><td>Total</td><td class="r num">${ks.reduce((t,c)=>t+m[c].pessoas,0).toLocaleString("pt-BR",{maximumFractionDigits:2})}</td>${colunas.map(([k])=>`<td class="r num">${brl(tot(k))}</td>`).join("")}</tr></tfoot></table></div></div>`;
}
function ccExcel(id){

  const ks=Object.keys(t.m).sort();const aoa=[["Centro de custo","Pessoas (equivalente)",...t.colunas.map(c=>c[1])],...ks.map(c=>[c,r2(t.m[c].pessoas),...t.colunas.map(([k])=>r2(t.m[c].v[k]||0))])];
  const ws=XLSX.utils.aoa_to_sheet(aoa);ws["!cols"]=aoa[0].map((h,i)=>({wch:i===0?40:Math.max(14,h.length+2)}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Por centro de custo");

const slugCC=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
/* encargos patronais (%) pelo regime da empresa da unidade */
function encPatronalPct(lojaId){
  const w=ST.wfp;const s=store(lojaId);let reg=s.regime||"lucro_real";
  if(w&&w.lojas&&w.lojas[lojaId]&&w.empresas){const e=w.empresas.find(x=>x.id===w.lojas[lojaId].empresa);if(e)reg=e.regime}
  const R=(w&&w.regimes&&w.regimes[reg])||(reg==="simples"?{inss:0,rat:0,fap:1,terceiros:0}:{inss:20,rat:1,fap:1,terceiros:5.8});
  return R.inss+R.rat*R.fap+R.terceiros;
}
/* ---- seção na ficha e editor de rateio ---- */
function rateioSecao(o,tipo){
  tipo=tipo||"emp";if(G())return "";const r=rateioDe(o,tipo);const multi=(rtDados(tipo,o).rateioCC||[]).length>1;const base=tipo==="pj"?pjCusto(o):(Number(o.salario)||0);
  return `<details class="fx-view" ${multi?"open":""}><summary>Centro de custo ${multi?`<span class="chip c-brand">rateado em ${r.length}</span>`:""}</summary>
    ${r.length?`<div class="table-wrap"><table><thead><tr><th>Centro de custo</th><th class="r">%</th><th class="r">${tipo==="pj"?"Custo mensal rateado":"Salário rateado"}</th></tr></thead><tbody>${r.map(x=>`<tr><td>${esc(x.cc)}</td><td class="r num">${x.pct.toLocaleString("pt-BR",{maximumFractionDigits:2})}%</td><td class="r num">${brl(base*x.pct/100)}</td></tr>`).join("")}</tbody></table></div>`:`<p class="small muted">Sem centro de custo cadastrado.</p>`}
    ${multi?"":`<button class="btn btn-sm btn-primary" data-rateio="${tipo}|${o.id}|1" style="margin-top:8px">${r.length?"Alterar centro de custo":"Definir centro de custo"}</button> `}<button class="btn btn-sm" data-rateio="${tipo}|${o.id}" style="margin-top:8px">${multi?"Editar rateio":"Ratear em dois ou mais centros de custo"}</button></details>`;
}
let RT_ED=null;

function rateioRender(){

      <td>${RT_ED.linhas.length>1?`<button class="btn btn-sm btn-ghost" data-rtdel="${i}" aria-label="Remover centro de custo">✕</button>`:""}</td></tr>`).join("")}
      <tr><td><button class="btn btn-sm" data-rtadd="1">+ Centro de custo</button></td><td class="r num"><b style="color:${ok?"var(--ok)":"var(--bad)"}">${tot.toLocaleString("pt-BR",{maximumFractionDigits:2})}%</b></td><td class="r num">${brl(base*tot/100)}</td><td></td></tr></tbody></table></div>
    ${ok?"":`<p class="small" style="color:var(--bad)">A soma está em ${tot.toLocaleString("pt-BR",{maximumFractionDigits:2})}%. Ajuste para 100%${tot<100?" (faltam "+(100-tot).toLocaleString("pt-BR",{maximumFractionDigits:2})+"%)":" (sobram "+(tot-100).toLocaleString("pt-BR",{maximumFractionDigits:2})+"%)"}.</p>`}
    <p class="small" id="rt-err" style="color:var(--bad)" hidden></p>`,
    `<button class="btn btn-ghost" data-rtlimpar="1">Voltar para um só centro de custo</button><button class="btn" data-close>Cancelar</button><button class="btn btn-primary" data-rtsalvar="1">Salvar rateio</button>`);
}
function rateioSalvar(){
  const o=rtAlvo(RT_ED.tipo,RT_ED.id);const f=rtDados(RT_ED.tipo,o);const err=m=>{const el=$("#rt-err");el.hidden=false;el.textContent=m};
  const l=RT_ED.linhas.map(x=>({cc:ccNorm(x.cc),pct:Math.round((Number(x.pct)||0)*100)/100})).filter(x=>x.cc||x.pct);
  if(!l.length)return err("Informe pelo menos um centro de custo.");
  if(l.some(x=>!x.cc))return err("Informe o centro de custo de todas as linhas.");
  if(l.some(x=>!(x.pct>0)))return err("Todo centro de custo precisa de um percentual maior que zero.");
  if(new Set(l.map(x=>x.cc)).size!==l.length)return err("O mesmo centro de custo aparece mais de uma vez.");
  const tot=l.reduce((t,x)=>t+x.pct,0);if(Math.abs(tot-100)>=0.005)return err("A soma dos percentuais precisa ser 100% (está em "+tot.toLocaleString("pt-BR",{maximumFractionDigits:2})+"%).");
  if(l.length===1){f.centroCusto=l[0].cc;delete f.rateioCC}else{f.rateioCC=l;if(!f.centroCusto)f.centroCusto=l.slice().sort((a,b)=>b.pct-a.pct)[0].cc}
  const nome=RT_ED.tipo==="pj"?pjNome(o):o.nome;logEvento("Rateio de centro de custo",nome+" · "+rateioTexto(o,RT_ED.tipo));
  const tipo=RT_ED.tipo;RT_ED=null;closeModal();commit("Rateio salvo");if(tipo==="pj")pjFicha(o.id);else fichaModal(o.id);
}
document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-rateio],[data-rtadd],[data-rtdel],[data-rtsalvar],[data-rtlimpar],[data-ccxls]");if(!t)return;const d=t.dataset;

  if(d.rtsalvar){rateioSalvar();return}
});

/* ============ importar backup de arquivo (.json) na versão Claude: substitui o cadastro, mantém os usuários ============ */
async function importarBackupClaude(file){
  if(!file)return;if(ROLE!=="rh"){toast("Só o RH pode importar backup.");return}
  let o;try{o=JSON.parse(await file.text())}catch(e){toast("Arquivo inválido. Use o backup .json baixado no portal.");return}
  if(!o||!Array.isArray(o.emps)||!Array.isArray(o.stores)){toast("Este arquivo não é um backup do Gestão de Pessoas.");return}
  if(ST&&ST.emps.length&&!confirm("Substituir TODOS os dados atuais pelos do backup ("+o.emps.length+" colaboradores, "+o.stores.length+" unidades)? Registros que não estiverem no backup serão apagados. Os usuários de acesso continuam."))return;
  const usuarios=ST.usuarios,desv=ST.contasDesvinculadas,cfg=ST.cfg;
  ["formato","versao","geradoEm","por","usuarios","contasDesvinculadas"].forEach(k=>delete o[k]);
  if(o.escala&&!o.escalaOverrides){const m={};o.escala.forEach(x=>{m[x.k]=x.d});o.escalaOverrides=m;delete o.escala}
  const ids=new Set(o.stores.map(s=>s.id));o.emps.forEach(e=>{if(e.lojaId&&!ids.has(e.lojaId)){ids.add(e.lojaId);o.stores.push({id:e.lojaId,nome:"Unidade "+e.lojaId,cidade:"",tipo:"Loja de rua",quadro:0})}});
  o.cfg=o.cfg||cfg;o.exemplo=false;o.usuarios=usuarios;o.contasDesvinculadas=desv;
  ST=normalize(o);if(typeof resumoBase==="function")resumoBase();
  logEvento("Backup importado",file.name+" · "+ST.emps.length+" colaboradores · "+ST.stores.length+" unidades");
  commit("Importando "+ST.emps.length+" colaboradores. Aguarde \"Tudo salvo\".");
}

/* RH: exclui os arquivos baixados há mais de 24 horas */
async function limpezaAnexos(){
  if(ROLE!=="rh")return;
  const lim=new Date(Date.now()-ANX_HORAS*3600e3).toISOString();
  const {data}=await SB.from("anexos").select("id,caminho").not("baixado_em","is",null).lt("baixado_em",lim).not("caminho","is",null).limit(300);
  if(!data||!data.length)return;
  const r=await SB.storage.from("anexos").remove(data.map(x=>x.caminho));if(r.error)return;
  await SB.from("anexos").update({caminho:null,excluido_em:new Date().toISOString()}).in("id",data.map(x=>x.id));
  logEvento("Anexos excluídos automaticamente",data.length+" arquivo(s) baixados há mais de "+ANX_HORAS+" horas");
}
/* imagem: comprime; a foto 3x4 é recortada em 600x800 e o fundo é conferido */
function anxImagem(file,foto){return new Promise(res=>{
  const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{URL.revokeObjectURL(url);const w=img.naturalWidth,h=img.naturalHeight;let sx=0,sy=0,sw=w,sh=h,W,H;
    if(foto){if(w/h>3/4){sw=h*3/4;sx=(w-sw)/2}else{sh=w*4/3;sy=(h-sh)/2}W=600;H=800}
    else{const k=Math.min(1,1800/Math.max(w,h));W=Math.round(w*k);H=Math.round(h*k)}
    const cv=document.createElement("canvas");cv.width=W;cv.height=H;const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,W,H);cx.drawImage(img,sx,sy,sw,sh,0,0,W,H);
    let aviso="";
    if(foto){const amostra=(x,y)=>{const d=cx.getImageData(x,y,90,110).data;let l=0,s=0,n=0;for(let i=0;i<d.length;i+=16){const r=d[i],g=d[i+1],b=d[i+2];l+=(r+g+b)/3;s+=Math.max(r,g,b)-Math.min(r,g,b);n++}return {l:l/n,s:s/n}};
      const a=amostra(4,4),b=amostra(W-94,4);if(a.l<195||b.l<195||a.s>45||b.s>45)aviso="O fundo da foto não parece branco. A foto pode ser recusada pelo credenciamento do aeroporto."}
    cv.toBlob(bl=>res(bl?{blob:bl,aviso}:null),"image/jpeg",foto?0.9:0.82)};
  img.onerror=()=>{URL.revokeObjectURL(url);toast("Não foi possível ler a imagem. Tente outra foto.");res(null)};
  img.src=url})}
async function anxPreparar(file,tipo){
  if(!file)return null;
  if(!/^(application\/pdf|image\/jpeg|image\/png)$/.test(file.type)){toast("Envie PDF, JPG ou PNG.");return null}
  if(tipo==="foto3x4"&&file.type==="application/pdf"){toast("A foto 3x4 precisa ser imagem (JPG ou PNG).");return null}
  let blob=file,mime=file.type;
  if(mime.startsWith("image/")){const r=await anxImagem(file,tipo==="foto3x4");if(!r)return null;if(r.aviso&&!confirm(r.aviso+"\n\nEnviar mesmo assim?"))return null;blob=r.blob;mime="image/jpeg"}
  if(blob.size>10485760){toast("O arquivo passa de 10 MB. Envie uma versão menor.");return null}
  return {blob,mime,ext:mime==="application/pdf"?"pdf":"jpg",nome:file.name.slice(0,150)};
}

/* ---- cartas em PDF (usadas pelo RH e pelo candidato) ---- */
function cartaBase(titulo,emp_){
  if(!window.jspdf||!window.jspdf.jsPDF){toast("O gerador de PDF não carregou. Recarregue a página.");return null}
  const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"});const W=210,M=20;
  doc.setFillColor(11,127,74);doc.rect(0,0,W,28,"F");doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(17);doc.text(emp_.nome||"BRASILEIRÍSSIMA",M,14);
  doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.text([emp_.cnpj?"CNPJ "+emp_.cnpj:"",emp_.endereco||""].filter(Boolean).join(" · ").slice(0,120),M,21);
  doc.setTextColor(16,32,26);doc.setFont("helvetica","bold");doc.setFontSize(14);doc.text(titulo,M,42);doc.setFont("helvetica","normal");
  return {doc,W,M};
}
function cartaTabela(doc,M,W,y,linhas){doc.setFontSize(10);linhas.forEach(([a,b],i)=>{const t=doc.splitTextToSize(String(b||"—"),W-2*M-55);const h=Math.max(8,t.length*5+3);if(i%2===0){doc.setFillColor(242,246,243);doc.rect(M,y-5,W-2*M,h,"F")}
  doc.setTextColor(91,109,100);doc.setFontSize(9);doc.text(a,M+3,y);doc.setTextColor(16,32,26);doc.setFontSize(10);doc.setFont("helvetica","bold");doc.text(t,M+55,y);doc.setFont("helvetica","normal");y+=h});return y}
function cartaOfertaPDF(c,emp_,lojaNome){
  const b=cartaBase("CARTA OFERTA DE EMPREGO",emp_);if(!b)return null;const {doc,W,M}=b;const o=c.oferta||{};let y=54;
  doc.setFontSize(10.5);let t=doc.splitTextToSize("Prezado(a) "+c.nome+",",W-2*M);doc.text(t,M,y);y+=9;
  t=doc.splitTextToSize("Temos o prazer de convidar você para fazer parte da equipe "+(emp_.nome||"Brasileiríssima")+", nas condições abaixo:",W-2*M);doc.text(t,M,y);y+=t.length*5+5;
  y=cartaTabela(doc,M,W,y,[["Cargo",c.cargo],["Unidade",lojaNome],["Salário mensal",o.salario?brl(o.salario):""],["Jornada",o.jornada],["Horário",o.horario],["Início previsto",o.inicio?fdate(o.inicio):""],["Contrato","Experiência de 45 dias, prorrogável por mais 45 dias (art. 445 da CLT)"],["Benefícios",o.beneficios]]);
  y+=6;t=doc.splitTextToSize("A contratação depende da entrega dos documentos de admissão, do resultado apto no exame admissional e, para as unidades em aeroporto, da aprovação do credenciamento junto à administração aeroportuária.",W-2*M);doc.text(t,M,y);y+=t.length*5+8;
  if(c.oferta_aceite_em){doc.setFont("helvetica","bold");doc.text("Proposta aceita eletronicamente pelo(a) candidato(a) em "+new Date(c.oferta_aceite_em).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})+",",M,y);y+=5;doc.text("pelo portal Gestão de Pessoas.",M,y);doc.setFont("helvetica","normal")}
  else{y=Math.max(y+14,230);doc.line(M,y,M+75,y);doc.line(W-M-75,y,W-M,y);doc.setFontSize(9);doc.text("Recursos Humanos",M+37.5,y+5,{align:"center"});doc.text("Ciente e de acordo: "+primeiro(c.nome),W-M-37.5,y+5,{align:"center"})}
  doc.setFontSize(7.5);doc.setTextColor(91,109,100);doc.text("Emitida em "+new Date().toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})+" pelo portal Gestão de Pessoas.",M,287);
  return doc;
}
function cartaBancoPDF(c,emp_,lojaNome){
  const b=cartaBase("SOLICITAÇÃO DE ABERTURA DE CONTA SALÁRIO",emp_);if(!b)return null;const {doc,W,M}=b;const o=c.oferta||{};let y=54;
  doc.setFontSize(10.5);doc.text("Ao "+(emp_.banco||"banco")+(emp_.agencia?" · Agência "+emp_.agencia:""),M,y);y+=10;

const CD_CAMPOS=["nascimento","sexo","estadoCivil","escolaridade","nomeMae","nomePai","racaCor","naturalidade","tituloEleitor","tituloZona","tituloSecao","reservista","cep","logradouro","numero","complemento","bairro","cidade","uf"];
const CD_OBRIG=["nascimento","sexo","estadoCivil","escolaridade","nomeMae","racaCor","cep","logradouro","numero","bairro","cidade","uf"];
const UFS="AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO".split(" ");
function cdValidarCampo(k,v){
  v=String(v||"").trim();
  if(!v)return CD_OBRIG.includes(k)?"Preencha este campo.":"";
  if(k==="nascimento"){const a=(Date.now()-new Date(v+"T12:00:00"))/(365.25*864e5);if(!(a>=14&&a<=90))return "Data de nascimento inválida."}
  if((k==="nomeMae"||k==="nomePai")&&(v.split(/\s+/).length<2||/\d/.test(v)))return "Informe o nome completo, sem números.";
  if(k==="cep"&&soDig(v).length!==8)return "O CEP precisa ter 8 números.";
  if(k==="uf"&&!UFS.includes(v.toUpperCase()))return "UF inválida. Use a sigla, por exemplo SP.";
  if(k==="tituloEleitor"&&soDig(v).length!==12)return "O título de eleitor tem 12 números.";
  if((k==="tituloZona"||k==="tituloSecao")&&!/^\d{1,4}$/.test(v))return "Use só números (até 4).";
  if((k==="cidade"||k==="bairro"||k==="logradouro")&&v.length<2)return "Preencha corretamente.";
  return "";
}
function cdValidar(d){const e={};CD_CAMPOS.forEach(k=>{const m=cdValidarCampo(k,d[k]);if(m)e[k]=m});return e}
function cdDepErros(x){const e={};const algum=x.nome||x.parentesco||x.nascimento||x.cpf;if(!algum)return e;

async function chamarUsuarios(body){
  const {data,error}=await SB.functions.invoke("usuarios",{body});
  if(error){let msg="Não foi possível falar com o servidor.";try{const j=await error.context.json();if(j&&j.erro)msg=j.erro}catch(e){}return msg}
  return data&&data.erro?data.erro:null;
}

async function salvarUsuario(loginEdit){
  const err=m=>{const el=$("#u-err");el.hidden=false;el.textContent=m};
  const u=loginEdit?USUARIOS.find(x=>x.login===loginEdit):null;
  const nome=$("#u-nome").value.trim(),login=u?u.login:normLogin($("#u-login").value),perfil=$("#u-perfil").value,lojas=[...document.querySelectorAll('input[name="u-lojas"]:checked')].map(i=>i.value),s1=$("#u-pass").value,s2=$("#u-pass2").value;
  const ativo=u?$("#u-ativo").checked:true;
  if(!nome)return err("Informe o nome.");
  if(perfil==="gerente"&&!lojas.length)return err("Marque pelo menos uma loja para o gerente.");
  if(!u&&!loginValido(login))return err("O usuário deve ter de 3 a 30 caracteres: letras minúsculas, números, ponto, hífen ou sublinhado.");
  if(!u||s1){if(s1.length<8)return err("A senha precisa ter pelo menos 8 caracteres.");if(s1!==s2)return err("As duas senhas não são iguais.")}
  const b=$("#u-salvar");b.disabled=true;b.textContent="Salvando…";
  const msg=await chamarUsuarios({acao:u?"atualizar":"criar",login,nome,perfil,lojas:perfil==="gerente"?lojas:[],senha:s1||undefined,ativo});
  b.disabled=false;b.textContent=u?"Salvar alterações":"Criar usuário";
  if(msg)return err(msg);
  await carregarUsuarios();closeModal();render();toast(u?"Usuário atualizado":"Usuário criado");
}

function filtrarFeriasEmp(q){

  $("#fe-cont").textContent=l.length===FE_OPTS.length?FE_OPTS.length+" colaboradores":l.length+" de "+FE_OPTS.length+" colaboradores";

function feriasCalc(){
  const e=emp($("#fe-emp").value);if(!e)return;const ini=$("#fe-ini").value;const dias=Number($("#fe-dias").value);const abono=dias===20?10:0;
  const sal=e.salario+(e.vendas?folha(e).comissao:0);
  const v=sal/30*dias,terco=v/3,ab=sal/30*abono,abT=ab/3;
  const avisos=[];const dw=parse(ini).getDay();
  if(dw===4||dw===5) avisos.push("Início em véspera de feriado ou de repouso semanal não é permitido; evite quinta e sexta (art. 134 §3º CLT).");
  if(diffDays(TODAY,ini)<30) avisos.push("O aviso de férias deve ser dado com 30 dias de antecedência.");
  if(e.comissao) avisos.push("Média de comissões incluída na remuneração das férias.");
  $("#fe-calc").innerHTML=`<div class="slip"><div class="slip-row h"><span>Verba</span><span>Ref.</span><span>Valor</span><span></span></div>
  <div class="slip-row"><span>Férias</span><span class="num">${dias}d</span><span class="num">${brl(v)}</span><span></span></div>
  <div class="slip-row"><span>1/3 constitucional</span><span></span><span class="num">${brl(terco)}</span><span></span></div>

let RS_OPTS=[];
const rsOpcao=(e,sel)=>`<option value="${e.id}" ${e.id===sel?"selected":""}>${esc(e.nome)} · ${esc(e.cargo)} · ${esc(store(e.lojaId).nome)}</option>`;
function filtrarRsEmp(q){
  const n=semAcento(q),d=soDig(q);const s=$("#rs-emp");const atual=s.value;
  const l=RS_OPTS.filter(e=>!n||semAcento([e.nome,e.cargo,store(e.lojaId).nome].join(" ")).includes(n)||(d.length>=3&&soDig(e.cpf).includes(d)));
  const sel=l.some(e=>e.id===atual)?atual:l[0]?.id;
  s.innerHTML=l.map(e=>rsOpcao(e,sel)).join("")||`<option value="">Ninguém encontrado</option>`;
  $("#rs-cont").textContent=l.length===RS_OPTS.length?RS_OPTS.length+" colaboradores":l.length+" de "+RS_OPTS.length+" colaboradores";

}

  if(d.lojaEscala){UI.escLoja=d.lojaEscala;location.hash="ponto";return}
  if(d.editloja){lojaForm(d.editloja);return}
  if(d.saveloja!==undefined){const nome=$("#l-nome").value.trim();if(!nome)return;const data={nome,cidade:$("#l-cid").value.trim(),tipo:$("#l-tipo").value,quadro:Number($("#l-quadro").value)||1};
    if(d.saveloja){Object.assign(store(d.saveloja),data)}else{ST.stores.push({id:"s"+uid(),...data})}closeModal();commit("Unidade salva");return}
  const act=d.act;
  if(act==="salvarAval"){salvarAvaliacao(t);return}
  if(act==="iniciarExemplo"){iniciarRH(seedData());return}
  if(act==="iniciarZero"){iniciarRH({exemplo:false,stores:[{id:"s1",nome:"Brasileiríssima Loja 1",cidade:"",tipo:"Loja de rua",quadro:10}],emps:[],cfg:JSON.parse(JSON.stringify(DEFAULT_CFG))});return}
  if(act==="aprovarTodas"){t.disabled=true;(async()=>{let n=0;for(const m of SOLIC.slice()){await decidirMov(m.id,true);n++}commit(n+" solicitações aprovadas")})();return}
  if(act==="novoColab") colabForm();
  if(act==="novaLoja") lojaForm();
  if(act==="novaAdm") admForm();
  if(act==="novaVaga") vagaForm();
  if(act==="progFerias") feriasModal();
  if(act==="simRescisao") rescisaoModal();
  if(act==="semanaAnt"){UI.escSemana=addDays(UI.escSemana,-7);render()}
  if(act==="semanaProx"){UI.escSemana=addDays(UI.escSemana,7);render()}
  if(act==="salvarFerias"){const e=emp($("#fe-emp").value);if(!e){toast("Escolha um colaborador na lista.");return}const dias=Number($("#fe-dias").value);const ini=$("#fe-ini").value;
    if(!ini){toast("Escolha a data de início.");return}
    if(e.ferias.some(f=>f.inicio===ini)){toast("Já existem férias programadas nessa data para "+e.nome.split(" ")[0]+".");return}
    e.ferias.push({inicio:ini,dias,abono:dias===20,aquisitivo:situacaoFerias(e).aquisIni,programadoEm:TODAY,programadoPor:SESSION?SESSION.login:""});
    logEvento("Férias programadas",e.nome+" · "+fdate(ini)+" · "+dias+" dias");commit();
    modal("Férias programadas",`<div class="who"><div class="avatar" style="width:48px;height:48px">${initials(e.nome)}</div><div><b>${esc(e.nome)}</b><span>${esc(e.cargo)} · ${esc(store(e.lojaId).nome)}</span></div></div>
      <div class="kv"><div><span>Início</span><b class="num">${fdate(ini)}</b></div><div><span>Fim</span><b class="num">${fdate(addDays(ini,dias-1))}</b></div><div><span>Retorno</span><b class="num">${fdate(addDays(ini,dias))}</b></div><div><span>Abono</span><b>${dias===20?"10 dias":"Não"}</b></div></div>
      <div class="note">O aviso de férias já está disponível para o gerente da loja no portal. Baixe o PDF, colha a assinatura do colaborador e marque como assinado.</div>`,
      `<button class="btn" data-close>Fechar</button><button class="btn btn-primary" data-pdfferias="${e.id}|${ini}">Baixar aviso em PDF</button>`)}
  if(act==="confirmarDeslig"){
    if(!emp($("#rs-emp").value)){toast("Escolha um colaborador na lista.");return}
    if(t.dataset.confirm!=="1"){t.dataset.confirm="1";t.textContent="Toque de novo para confirmar";return}
    const e=emp($("#rs-emp").value);e.desligado={data:$("#rs-data").value,tipo:$("#rs-tipo").value};
    ST.eventos.push({id:uid(),codigo:"S-2299",desc:"Desligamento",ref:e.nome,data:e.desligado.data,status:"Pendente"});closeModal();commit(e.nome.split(" ")[0]+" desligado(a)")}
  if(act==="salvarAdm"){const nome=$("#a-nome").value.trim();if(!nome){const er=$("#a-err");er.hidden=false;er.textContent="Informe o nome do candidato.";return}
    ST.admissoes.push({id:uid(),nome,cargo:$("#a-cargo").value,lojaId:$("#a-loja").value,salario:Number($("#a-sal").value),inicio:$("#a-ini").value,obs:$("#a-obs").value,etapa:0});closeModal();
    if(page!=="admissao")location.hash="admissao";commit("Admissão iniciada")}
  if(act==="salvarVaga"){ST.vagas.push({id:uid(),cargo:$("#v-cargo").value,lojaId:$("#v-loja").value,qtd:Number($("#v-qtd").value)||1,tipo:$("#v-tipo").value,abertura:TODAY,candidatos:0,status:"Divulgação"});closeModal();commit("Vaga aberta")}
  if(act==="fecharFolha"){ST.folhasFechadas[UI.comp]=TODAY;ST.eventos.push({id:uid(),codigo:"S-1200",desc:"Remuneração "+compLabel(UI.comp),ref:UI.folhaLoja?store(UI.folhaLoja).nome:"Todas as unidades",data:TODAY,status:"Pendente"},{id:uid(),codigo:"S-1299",desc:"Fechamento dos periódicos",ref:compLabel(UI.comp),data:TODAY,status:"Pendente"});commit("Folha de "+compLabel(UI.comp)+" fechada")}
  if(act==="recarga"){const tot=Number($(".kpi.hero .val").textContent.replace(/[^\d,]/g,"").replace(",","."));ST.recargas.unshift({comp:curComp,data:TODAY,valor:tot});commit("Recarga registrada")}
  if(act==="transmitirTodos"){ST.eventos.forEach(e=>e.status="Transmitido");commit("Todos os eventos marcados como transmitidos")}
  if(act==="limpar"){
    if(t.dataset.confirm!=="1"){t.dataset.confirm="1";t.textContent="Apagar exemplos? Toque de novo";return}
    ST=normalize({exemplo:false,stores:[{id:"s1",nome:"Brasileiríssima Loja 1",cidade:"",tipo:"Loja de rua",quadro:10}],emps:[],cfg:ST.cfg});commit("Pronto. Cadastre sua primeira unidade e equipe.")}
  if(act==="restaurar"){if(t.dataset.confirm!=="1"){t.dataset.confirm="1";t.textContent="Substituir tudo pelos exemplos? Toque de novo";return}ST=normalize(seedData());commit("Dados de exemplo recarregados")}
  if(act==="baixarBackup"){baixarBackup();return}
  if(act==="zerarModal"){zerarModal();return}
  if(act==="zerarOk"){zerarOk();return}
  if(act==="gerarBackup"){$("#backup").value=JSON.stringify(ST)}
  if(act==="copiarBackup"){const ta=$("#backup");if(!ta.value)ta.value=JSON.stringify(ST);navigator.clipboard?.writeText(ta.value).then(()=>toast("Backup copiado"),()=>{ta.select();toast("Selecionado. Use Copiar do teclado")})}
  if(act==="importar"){try{const o=JSON.parse($("#backup").value);if(!o.emps||!o.stores)throw 0;ST=normalize(o);commit("Backup importado")}catch(e){toast("Não foi possível ler o backup. Cole o texto completo gerado por aqui.")}}
});

function avaliacaoModal(eid,marco){
  const e=emp(eid);if(!e)return;
  AV={eid,marco,notas:{},parecer:null};
  const dx=Math.min(90,diffDays(e.admissao,TODAY));const prazo=addDays(e.admissao,marco-1);
  const ops=marco===45?[["prorrogar","Prorrogar até 90 dias"],["efetivar","Efetivar agora"],["encerrar","Encerrar no 45º dia"]]:[["efetivar","Efetivar"],["encerrar","Encerrar no 90º dia"]];
  modal("Avaliação de "+marco+" dias",`
    <div class="who"><div class="avatar" style="width:48px;height:48px">${initials(e.nome)}</div><div><b>${esc(e.nome)}</b><span>${esc(e.cargo)} · ${esc(store(e.lojaId).nome)} · admissão ${fdate(e.admissao)}</span></div></div>
    <div><span class="xp-lbl num">Dia ${dx} de 90 · prazo desta avaliação ${fdate(prazo)}</span><div class="xp" style="width:100%"><i style="width:${Math.max(0,dx)/90*100}%"></i><b style="left:calc(50% - 1px)"></b></div></div>
    <div class="form-grid">
      <div class="field"><label for="av-quem">Avaliador(a)</label><input class="input" id="av-quem" value="${esc(gestorDe(e.lojaId))}"></div>
      <div class="field"><label for="av-data">Data da avaliação</label><input class="input" id="av-data" type="date" value="${TODAY}"></div>
    </div>
    <div><div class="scale-hint"><span>1 Insatisfatório</span><span>3 Dentro do esperado</span><span>5 Excelente</span></div>
    ${criterios(e.cargo).map(c=>`<div class="crit"><p>${c.t}<small>${c.d}</small></p><div class="rate" role="group" aria-label="${c.t}">${[1,2,3,4,5].map(n=>`<button type="button" data-rate="${c.k}|${n}" title="${ESCALA[n]}">${n}</button>`).join("")}</div></div>`).join("")}</div>
    <div class="form-grid">
      <div class="field"><label for="av-faltas">Faltas no período</label><input class="input num" id="av-faltas" type="number" min="0" value="0"></div>
      <div class="field"><label for="av-atrasos">Atrasos no período</label><input class="input num" id="av-atrasos" type="number" min="0" value="0"></div>
      <div class="field full"><label for="av-fortes">Pontos fortes</label><textarea class="input" id="av-fortes" rows="2"></textarea></div>
      <div class="field full"><label for="av-desenv">Pontos a desenvolver</label><textarea class="input" id="av-desenv" rows="2"></textarea></div>
    </div>
    <div class="field"><label>Decisão</label><div class="seg" role="radiogroup">${ops.map(([k,t])=>`<button type="button" data-parecer="${k}">${t}</button>`).join("")}</div></div>
    <div class="av-sum" id="av-sum"></div>
    <p class="small" id="av-err" style="color:var(--bad)" hidden></p>`,
    `<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" data-act="salvarAval" id="av-save">Salvar avaliação</button>`);
  avResumo();
}
function avResumo(){
  const e=emp(AV.eid);const tot=criterios(e.cargo).length;const n=Object.keys(AV.notas).length;const m=mediaNotas(AV.notas);
  const r=n?recomenda(m):null;
  $("#av-sum").innerHTML=`<div><span class="small muted">Nota média · ${n} de ${tot} critérios</span><br><b class="num">${n?m.toLocaleString("pt-BR",{minimumFractionDigits:1}):"—"}</b></div>${r?`<span class="chip ${r.c}">${r.t}</span>`:`<span class="small muted">Dê uma nota de 1 a 5 em cada critério</span>`}`;
  const b=$("#av-save");if(b){b.dataset.confirm="";b.className="btn "+(AV.parecer==="encerrar"?"btn-danger":"btn-primary");b.textContent=AV.parecer==="encerrar"?"Salvar e encerrar contrato":AV.parecer==="efetivar"?"Salvar e efetivar":"Salvar avaliação"}
}
function salvarAvaliacao(btn){
  const e=emp(AV.eid);const err=$("#av-err");const cs=criterios(e.cargo);
  const falta=cs.filter(c=>!AV.notas[c.k]);
  if(falta.length){err.hidden=false;err.textContent="Falta dar nota em: "+falta.map(c=>c.t).join(", ")+".";return}
  if(!AV.parecer){err.hidden=false;err.textContent="Escolha a decisão: "+(AV.marco===45?"prorrogar, efetivar ou encerrar.":"efetivar ou encerrar.");return}
  if(!$("#av-quem").value.trim()){err.hidden=false;err.textContent="Informe quem fez a avaliação.";return}
  if(AV.parecer==="encerrar"&&btn.dataset.confirm!=="1"){btn.dataset.confirm="1";btn.textContent="Toque de novo para encerrar o contrato";return}
  const a={id:uid(),marco:AV.marco,data:$("#av-data").value||TODAY,avaliador:$("#av-quem").value.trim(),notas:{...AV.notas},media:mediaNotas(AV.notas),
    faltas:Number($("#av-faltas").value)||0,atrasos:Number($("#av-atrasos").value)||0,fortes:$("#av-fortes").value.trim(),desenvolver:$("#av-desenv").value.trim(),parecer:AV.parecer};
  AV=null;closeModal();
  if(G()){enviarMov({tipo:"avaliacao",eid:e.id,av:a},"Avaliação enviada ao RH para aprovação");return}
  commit(aplicarAvaliacao(e,a));
}
function verAvaliacao(eid,aid){
  const e=emp(eid);const a=e&&(e.avaliacoes||[]).find(x=>x.id===aid);if(!a)return;
  mostrarAv(e,a,`<button class="btn" data-ficha="${e.id}">Abrir ficha</button><button class="btn btn-primary" data-close>Fechar</button>`);
}
function mostrarAv(e,a,foot){
  const r=recomenda(a.media);const pc=a.pendente?{t:"Aguardando RH",c:"c-warn"}:PARECER[a.parecer];
  modal("Avaliação de "+a.marco+" dias",`
    <div class="who"><div class="avatar" style="width:48px;height:48px">${initials(e.nome)}</div><div><b>${esc(e.nome)}</b><span>${esc(e.cargo)} · ${esc(store(e.lojaId).nome)}</span></div><span class="chip ${pc.c}" style="margin-left:auto">${pc.t}</span></div>
    <div class="note">Decisão: <b>${esc(PARECER[a.parecer].t)}</b></div>
    <div class="av-sum"><div><span class="small muted">Nota média</span><br><b class="num">${a.media.toLocaleString("pt-BR",{minimumFractionDigits:1})}</b></div><span class="chip ${r.c}">${r.t}</span></div>
    <div>${criterios(e.cargo).map(c=>{const n=a.notas[c.k]||0;return `<div class="crit"><p>${c.t}<small>${n?ESCALA[n]:"Sem nota"}</small></p><div class="rate" aria-label="Nota ${n}">${[1,2,3,4,5].map(i=>`<button type="button" tabindex="-1" class="${i===n?"on":""}" style="cursor:default" aria-hidden="true">${i}</button>`).join("")}</div></div>`}).join("")}</div>
    <div class="kv"><div><span>Avaliador(a)</span><b>${esc(a.avaliador)}</b></div><div><span>Data</span><b class="num">${fdate(a.data)}</b></div><div><span>Faltas</span><b class="num">${a.faltas}</b></div><div><span>Atrasos</span><b class="num">${a.atrasos}</b></div></div>
    ${a.fortes?`<div class="note"><b>Pontos fortes:</b> ${esc(a.fortes)}</div>`:""}
    ${a.desenvolver?`<div class="note"><b>Pontos a desenvolver:</b> ${esc(a.desenvolver)}</div>`:""}`,foot);
}

  </form>`,`<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" data-act="salvarVaga">Abrir vaga</button>`);
}
